---
name: ci
on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The CLI scans the whole history every run. The gitleaks-action scans only the
      # pushed range, and fails on a push that includes the root commit (it asks for root^).
      - name: Install gitleaks
        run: curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" | tar -xz gitleaks
        env:
          V: "8.30.1"
      - name: Scan full history
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose

  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible-core ansible-lint
      - run: ansible-galaxy collection install -r ci/requirements.yml
      - run: ansible-lint
