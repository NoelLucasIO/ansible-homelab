---
# Build a VM whose address and DNS come from NIOS IPAM.
#   ansible-playbook playbooks/provision.yml -e vm_name=web01 [-e vm_memory_mb=8192 -e vm_vcpus=4 -e vm_disk_gb=80]
- name: Provision a VM from NIOS IPAM
  hosts: "{{ nios_kvm_host | default('fedora') }}"
  become: true
  gather_facts: false
  module_defaults:
    ansible.builtin.uri:
      user: "{{ nios_api_user }}"
      password: "{{ nios_api_password }}"
      force_basic_auth: true
      validate_certs: false
      body_format: json
      return_content: true
      status_code: [200, 201]
      timeout: 60
  pre_tasks:
    - name: Check inputs
      ansible.builtin.assert:
        that:
          - vm_name is defined
          - vm_name is match('^[a-z0-9][a-z0-9-]{0,62}$')
          - vm_ssh_pubkeys | select('search', 'CHANGE_ME') | list | length == 0
        fail_msg: "Pass -e vm_name=<lowercase-hostname> and set vm_ssh_pubkeys in group_vars/all/vars.yml."

    - name: Name it
      ansible.builtin.set_fact:
        vm_fqdn: "{{ vm_name }}.{{ vm_domain }}"
        vm_cockpit_fqdn: "{{ vm_name }}{{ vm_cockpit_suffix }}.{{ vm_domain }}"
  tasks:
    - name: 1. Address and host record from NIOS
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/allocate_ip.yml"

    - name: 2. Disk, cloud-init seed, VM
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/build_vm.yml"

    - name: 3. Wait for SSH on the new address
      ansible.builtin.wait_for:
        host: "{{ vm_ip }}"
        port: 22
        timeout: 600

    - name: 4. Name resolves through Unbound (NIOS -> clients)
      ansible.builtin.command: dig @{{ vm_gateway }} +short {{ vm_fqdn }}
      register: vm_dig
      changed_when: false
      until: vm_ip in vm_dig.stdout
      retries: 10
      delay: 6

    - name: 5. Cockpit through NPM with the wildcard certificate
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/npm_proxy.yml"

    - name: Hand the new VM to the baseline play
      ansible.builtin.add_host:
        name: "{{ vm_fqdn }}"
        groups: [new_vm]
        ansible_host: "{{ vm_ip }}"
        ansible_user: "{{ vm_admin_user }}"
        # CLI runs: the automation private key. In AAP, leave unset; the machine credential supplies it.
        ansible_ssh_private_key_file: "{{ vm_admin_private_key | default(omit) }}"
        vm_spec: "{{ vm_vcpus }} vCPU, {{ vm_memory_mb }} MB, {{ vm_disk_gb }} GB"
        baseline_cockpit_fqdn: "{{ vm_cockpit_fqdn }}"
      changed_when: false   # in-memory inventory only

- name: Apply the baseline to the new VM
  hosts: new_vm
  become: true
  gather_facts: true
  vars:
    baseline_manage_firewalld: true
  roles:
    - baseline
  post_tasks:
    - name: Done
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} is up at {{ ansible_host }} ({{ vm_spec }}), baselined:
          users, chrony->gw, firewalld, node_exporter (registered), rsyslog -> Loki + Splunk.
          Cockpit: https://{{ baseline_cockpit_fqdn }}
