---
# --- Who can log in ---------------------------------------------------------------
baseline_admin_user: admin        # your own login; its password hash lives in the vault
baseline_users:
  - name: ansible                  # AAP (homelab-ssh credential)
    groups: ["{{ baseline_admin_group }}"]
    sudo_nopasswd: true
    keys: "{{ vm_ssh_pubkeys | select('search', 'aap-automation') | list }}"
  - name: "{{ baseline_admin_user }}"
    groups: ["{{ baseline_admin_group }}"]
    sudo_nopasswd: false           # wheel/sudo default: sudo asks for the password
    password_hash: "{{ baseline_admin_password_hash }}"   # vault
    keys: "{{ vm_ssh_pubkeys | reject('search', 'aap-automation') | list }}"

# --- System -------------------------------------------------------------------------
baseline_timezone: America/New_York
baseline_ntp_servers: [192.0.2.1]
# Same lists the golden images are built with (roles/ipam_vm_defaults).
baseline_debian: "{{ ansible_facts.os_family | default('') == 'Debian' }}"
baseline_packages: "{{ vm_base_packages_debian if baseline_debian else vm_base_packages_redhat }}"
baseline_admin_group: "{{ 'sudo' if baseline_debian else 'wheel' }}"
baseline_chrony_service: "{{ 'chrony' if baseline_debian else 'chronyd' }}"
baseline_chrony_conf: "{{ '/etc/chrony/chrony.conf' if baseline_debian else '/etc/chrony.conf' }}"

# Updates applied daily: dnf-automatic (EL/Fedora) or unattended-upgrades (Debian/Ubuntu).
# On Debian/Ubuntu, unattended-upgrades' own origin list decides (security by default),
# so 'default' behaves like 'security' there.
baseline_auto_updates: security    # security | default | none
# One full dnf upgrade / apt dist-upgrade (+ reboot if anything changed). Off here so
# baseline.yml never upgrades existing hosts; provision.yml turns it on for new VMs.
baseline_full_update: false
baseline_full_update_marker: /var/lib/baseline-full-update
baseline_update_timer: >-
  {{ 'apt-daily-upgrade.timer' if baseline_debian
     else ('dnf5-automatic.timer' if ansible_facts.pkg_mgr | default('') == 'dnf5' else 'dnf-automatic.timer') }}

# Optional RHEL registration (Developer subscription works): set both, e.g. in the vault.
# rhsm_org: "1234567"
# rhsm_activation_key: homelab

# Off by default so running baseline.yml on existing hosts (fedora, Splunk, AAP,
# which run without firewalld) never turns a firewall on under them.
# provision.yml sets it true for new VMs.
baseline_manage_firewalld: false
baseline_firewalld_services: [ssh, cockpit]
baseline_firewalld_ports: [9100/tcp]
# Debian/Ubuntu use ufw (Debian's cloud-init Conflicts with firewalld): same openings as ports.
baseline_ufw_ports: [22/tcp, 9090/tcp, 9100/tcp]

# --- Monitoring ----------------------------------------------------------------------
baseline_node_exporter_version: "1.9.1"
baseline_prometheus_host: "{{ nios_kvm_host | default('fedora') }}"
baseline_prometheus_targets_dir: /etc/prometheus/targets/nodes
baseline_prometheus_owner: root

# --- Logging (rsyslog forwards journald + syslog) -------------------------------------
baseline_log_port: 1516
baseline_log_alloy: 192.0.2.45     # Loki via netmon Alloy, RFC 5424, octet-counted
baseline_log_splunk: 192.0.2.36    # Splunk tcp://1516, index linux
baseline_log_splunk_min_severity: info
