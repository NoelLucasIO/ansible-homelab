---
- name: Accounts
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: "{{ item.groups }}"
    append: true
    shell: /bin/bash
    password: "{{ item.password_hash | default(omit) }}"
    update_password: always
  loop: "{{ baseline_users }}"
  loop_control: { label: "{{ item.name }}" }
  no_log: true

- name: .ssh directories
  ansible.builtin.file:
    path: "/home/{{ item.name }}/.ssh"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0700"
  loop: "{{ baseline_users }}"
  loop_control: { label: "{{ item.name }}" }

- name: Authorized keys
  ansible.builtin.lineinfile:
    path: "/home/{{ item.0.name }}/.ssh/authorized_keys"
    line: "{{ item.1 }}"
    create: true
    owner: "{{ item.0.name }}"
    group: "{{ item.0.name }}"
    mode: "0600"
  loop: "{{ baseline_users | subelements('keys') }}"
  loop_control: { label: "{{ item.0.name }}: {{ item.1.split()[-1] }}" }

- name: Passwordless sudo where intended
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-baseline-{{ item.name }}"
    content: "{{ item.name }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: visudo -cf %s
  loop: "{{ baseline_users | selectattr('sudo_nopasswd') | list }}"
  loop_control: { label: "{{ item.name }}" }
