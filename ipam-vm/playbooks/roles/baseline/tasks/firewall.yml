---
# EL/Fedora: firewalld. Debian/Ubuntu: ufw (Debian's cloud-init package Conflicts with firewalld).
- name: Ensure firewalld is running
  ansible.builtin.systemd_service: { name: firewalld, enabled: true, state: started }
  when: not baseline_debian

- name: Allowed services
  ansible.builtin.shell: >-
    firewall-cmd --permanent --query-service={{ item }} ||
    { firewall-cmd --permanent --add-service={{ item }} && echo CHANGED; }
  loop: "{{ baseline_firewalld_services }}"
  register: baseline_fw_svc
  changed_when: "'CHANGED' in baseline_fw_svc.stdout"
  notify: Reload firewalld
  when: not baseline_debian

- name: Allowed ports
  ansible.builtin.shell: >-
    firewall-cmd --permanent --query-port={{ item }} ||
    { firewall-cmd --permanent --add-port={{ item }} && echo CHANGED; }
  loop: "{{ baseline_firewalld_ports }}"
  register: baseline_fw_port
  changed_when: "'CHANGED' in baseline_fw_port.stdout"
  notify: Reload firewalld
  when: not baseline_debian

- name: ufw allows ({{ baseline_ufw_ports | join(', ') }})
  ansible.builtin.shell: >-
    ufw status verbose | grep -qE '^{{ item }} +ALLOW IN' ||
    { ufw allow {{ item }} >/dev/null && echo CHANGED; }
  loop: "{{ baseline_ufw_ports }}"
  register: baseline_ufw_rule
  changed_when: "'CHANGED' in baseline_ufw_rule.stdout"
  when: baseline_debian

- name: ufw on, deny other inbound
  ansible.builtin.shell: >-
    ufw status | grep -q '^Status: active' ||
    { ufw default deny incoming >/dev/null && ufw --force enable >/dev/null && echo CHANGED; }
  register: baseline_ufw_on
  changed_when: "'CHANGED' in baseline_ufw_on.stdout"
  when: baseline_debian
