---
# Defaults (lowest precedence): inventory values, AAP's included, override them.

# --- Which systems --------------------------------------------------------------------
kernel_retention_hosts: all                 # inventory pattern (the AAP survey sets it)
# Per host: kernel_retention_skip: true leaves a host out. Hosts with tideline_skip: true or
# named in tideline_appliances (vendor appliances) are left out too.
kernel_retention_distributions:             # anything else is reported and left alone
  - Fedora
  - RedHat
  - CentOS
  - Rocky
  - AlmaLinux
  - OracleLinux
  - Debian
kernel_retention_container_types: [lxc, docker, podman, container, systemd-nspawn, openvz]

# --- What a run does ------------------------------------------------------------------
kernel_retention_keep: 2                    # kernels kept per host: the running one + the newest other
kernel_retention_set_config: true           # dnf: installonly_limit in /etc/dnf/dnf.conf
kernel_retention_purge: true                # remove the kernels over the limit now

# dnf: the installonly kernel packages removed with their release. kernel-headers and
# kernel-tools aren't installonly (one version, tracks the newest) and are never touched.
# Variant flavours (kernel-debug*, kernel-rt*, kernel-64k*) aren't handled.
kernel_retention_rpm_core: [kernel-core, kernel]   # first one installed defines the releases
kernel_retention_rpm_names:
  - kernel
  - kernel-core
  - kernel-modules
  - kernel-modules-core
  - kernel-modules-extra
  - kernel-modules-internal
  - kernel-devel
  - kernel-devel-matched
  - kernel-uki-virt
  - kernel-uki-virt-addons
