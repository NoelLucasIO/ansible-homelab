---
# Defaults only. Role defaults have the lowest precedence, so anything set in the
# inventory (AAP inventory variables included) or with -e overrides them.
# A playbook-adjacent group_vars/all would NOT: it outranks inventory-level vars.
# Defaults for bootstrap-host.yml (inventory host/group vars override these).
automation_user: ansible
automation_pubkey: ""          # set in inventory: public key of the AAP machine credential
bootstrap_selinux: permissive
bootstrap_sysctls: {}
bootstrap_update: false
# KVM hosts: shut guests down cleanly (ACPI) when the host shuts down or reboots, instead
# of the stop killing QEMU. Leaves guest start-up to each VM's own autostart flag.
bootstrap_libvirt_guests: false
bootstrap_libvirt_guests_timeout: 300   # seconds to wait for each guest before powering off
