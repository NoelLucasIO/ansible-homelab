---
# Data access to namespaces for an application service account: a local tenant user with no
# roles (it can't use the consoles) and data-access permissions on the listed namespaces. The
# namespace owner stays as it is (namespace.yml).
#   ansible-playbook playbooks/namespace_access.yml -e hcp_kvm_host=fedora -e hcp_cluster=hcp02 \
#     -e hcp_backend_ip=198.51.100.101 -e hcp_tenant_name=tenant1 -e hcp_svc_user=app1 \
#     -e hcp_svc_namespaces=ns1,ns2 -e hcp_svc_password=...
# HCP's own `admin jvm userAccount` over the back-end, like the other steps: no tenant
# credentials, and no password in any URL or access log. The password is used only when the
# account is created; a rerun leaves it alone and brings the listed namespaces' permissions in
# line, keeping the account's permissions on other namespaces. An existing user that has roles
# is refused: it isn't a service account.
# S3 credentials: access key = base64(username), secret key = the password hashed with the
# account's password hash scheme (hcp_svc_hash_scheme: MD5, HCP's default, or SHA-256).
- name: HCP namespace access for a service account
  hosts: "{{ hcp_kvm_host | default('fedora') }}"
  become: true
  gather_facts: false
  roles:
    - hcp_vm_defaults
  vars:
    # Console checkbox -> admin jvm mask letter, and HCP's permission names -> letter.
    hcp_svc_letters: {browse: b, read_acl: R, read: r, write_acl: W, write: w, delete: d, purge: p,
                      search: s, change_owner: c, privileged: P}
    hcp_svc_name_letters: {BROWSE: b, READ_ACL: R, READ: r, WRITE_ACL: W, WRITE: w, DELETE: d, PURGE: p,
                           SEARCH: s, CHOWN: c, PRIVILEGED: P, BYPASS_GOVERNANCE: B,
                           GET_BUCKET_CONFIGURATION: g, GET_OBJ_LEGAL_HOLD: l, GET_OBJ_RETENTION: o,
                           PUT_BUCKET_CONFIGURATION: G, PUT_OBJ_LEGAL_HOLD: L, PUT_OBJ_RETENTION: O}
    hcp_to_json: >-
      python -c 'import sys,ast,json; print(json.dumps(ast.literal_eval(sys.stdin.read())))'
  tasks:
    # Lists may come as YAML lists or comma/newline-separated text (AAP survey).
    - name: Normalise the namespace and permission lists
      ansible.builtin.set_fact:
        hcp_svc_ns: >-
          {{ (hcp_svc_namespaces if hcp_svc_namespaces is not string
              else hcp_svc_namespaces | regex_replace('[\s,]+', ',') | split(','))
             | map('trim') | reject('equalto', '') | unique | list }}
        hcp_svc_perms: >-
          {{ (hcp_svc_permissions if hcp_svc_permissions is not string
              else hcp_svc_permissions | regex_replace('[\s,]+', ',') | split(','))
             | map('trim') | map('lower') | reject('equalto', '') | unique | list }}

    - name: Check inputs
      ansible.builtin.assert:
        that:
          - hcp_cluster is match('^[a-z][a-z0-9-]{0,30}$')
          - hcp_backend_ip is match('^(\d{1,3}\.){3}\d{1,3}$')
          - hcp_root_key_file is defined
          - hcp_tenant_name is match('^[A-Za-z0-9][A-Za-z0-9-]{0,62}$')
          - hcp_svc_user is match('^[A-Za-z0-9][A-Za-z0-9._@-]{0,63}$')
          - hcp_svc_user != hcp_tenant_admin_user
          - hcp_svc_ns | length > 0
          - hcp_svc_ns | reject('match', '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$') | list | length == 0
          - hcp_svc_perms | length > 0
          - hcp_svc_perms | difference(hcp_svc_letters.keys() | list) | length == 0
          - hcp_svc_hash_scheme in ['MD5', 'SHA-256']
        fail_msg: >-
          Need hcp_cluster, hcp_backend_ip, the HCP secrets credential, hcp_tenant_name, a service
          account name (not the tenant admin user), namespaces (got {{ hcp_svc_ns }}) and
          permissions from {{ hcp_svc_letters.keys() | join(', ') }} (got {{ hcp_svc_perms }});
          hash scheme MD5 or SHA-256.
        quiet: true

    - name: Wanted mask
      ansible.builtin.set_fact:
        hcp_svc_mask: "{{ hcp_svc_perms | map('extract', hcp_svc_letters) | sort | join('') }}"

    - name: Access over the back-end
      block:
        - name: Open a back-end session
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/backend_open.yml"

        - name: Namespaces in the tenant (fails if the tenant doesn't exist)
          ansible.builtin.command:
            argv: "{{ hcp_bssh + [hcp_admin ~ ' namespace list --tenant ' ~ hcp_tenant_name ~ ' | ' ~ hcp_to_json] }}"
          register: hcp_svc_nslist
          changed_when: false

        - name: Namespace UUIDs
          ansible.builtin.set_fact:
            hcp_svc_uuid: >-
              {{ dict((hcp_svc_nslist.stdout | from_json).values() | map(attribute='name')
                      | zip((hcp_svc_nslist.stdout | from_json).values() | map(attribute='uuid'))) }}

        - name: The namespaces exist
          ansible.builtin.assert:
            that: hcp_svc_ns | difference(hcp_svc_uuid.keys() | list) | length == 0
            fail_msg: "Not in {{ hcp_tenant_name }}: {{ hcp_svc_ns | difference(hcp_svc_uuid.keys() | list) | join(', ') }}"
            quiet: true

        - name: Tenant user accounts
          ansible.builtin.command:
            argv: "{{ hcp_bssh + [hcp_admin ~ ' userAccount list ' ~ hcp_tenant_name ~ ' | ' ~ hcp_to_json] }}"
          register: hcp_svc_users
          changed_when: false

        - name: The service account, if it exists
          ansible.builtin.set_fact:
            hcp_svc_acct: >-
              {{ (hcp_svc_users.stdout | from_json).values() | selectattr('name', 'equalto', hcp_svc_user)
                 | first | default({}) }}

        - name: An existing user with roles isn't a service account
          ansible.builtin.assert:
            that: hcp_svc_acct.roles | default('') | trim in ['', 'None', 'NONE']
            fail_msg: >-
              '{{ hcp_svc_user }}' exists with roles {{ hcp_svc_acct.roles }}: not touching it. Use
              another name for the service account.
            quiet: true
          when: hcp_svc_acct | length > 0

        - name: Password for a new account
          ansible.builtin.assert:
            that: hcp_svc_password | default('') | length > 0
            fail_msg: "'{{ hcp_svc_user }}' doesn't exist yet: hcp_svc_password is needed to create it."
            quiet: true
          when: hcp_svc_acct | length == 0

        # Every namespace mapping as <uuid>,<mask>: kept ones for namespaces not listed here,
        # the wanted mask for the listed ones. HCP replaces all mappings on update.
        - name: Wanted namespace permissions
          ansible.builtin.set_fact:
            hcp_svc_have: >-
              {{ dict((hcp_svc_acct.namespaceUUIDPermMap | default({}, true)) | dict2items
                 | map(attribute='key')
                 | zip((hcp_svc_acct.namespaceUUIDPermMap | default({}, true)) | dict2items
                       | map(attribute='value')
                       | map('regex_replace', '[\[\] ]', '') | map('split', ',')
                       | map('map', 'extract', hcp_svc_name_letters) | map('sort') | map('join', ''))) }}
        - name: Merge
          ansible.builtin.set_fact:
            hcp_svc_want: >-
              {{ hcp_svc_have | combine(dict(hcp_svc_ns | map('extract', hcp_svc_uuid)
                                             | zip([hcp_svc_mask] * (hcp_svc_ns | length)))) }}

        - name: Create the service account
          ansible.builtin.command:
            argv: >-
              {{ hcp_bssh + [hcp_admin ~ ' userAccount create ' ~ hcp_tenant_name ~ ' ' ~ hcp_svc_user | quote
                 ~ ' ' ~ hcp_svc_password | quote ~ ' ' ~ (hcp_svc_fullname or hcp_svc_user) | quote
                 ~ ' --passwordHashScheme ' ~ hcp_svc_hash_scheme
                 ~ ' --description ' ~ ('Service account, data access only (hcp-vm)') | quote
                 ~ hcp_svc_want | dict2items | map(attribute='key')
                   | zip(hcp_svc_want | dict2items | map(attribute='value'))
                   | map('join', ',') | map('regex_replace', '^', ' --namespace ') | join('')] }}
          register: hcp_svc_new
          no_log: true
          changed_when: true
          failed_when: >-
            hcp_svc_new.rc != 0 or hcp_svc_new.stdout is search('(?i)exception|error|usage:|cannot|invalid')
          when: hcp_svc_acct | length == 0

        - name: New account created?
          ansible.builtin.assert:
            that: hcp_svc_new is not failed
            fail_msg: >-
              admin jvm refused the account:
              {{ (hcp_svc_new.stdout | default('') ~ ' ' ~ hcp_svc_new.stderr | default(''))
                 | replace(hcp_svc_password | default('-'), '********') | trim | truncate(400) }}
          when: hcp_svc_acct | length == 0

        - name: Update its namespace permissions
          ansible.builtin.command:
            argv: >-
              {{ hcp_bssh + [hcp_admin ~ ' userAccount update ' ~ hcp_tenant_name ~ ' ' ~ hcp_svc_acct.userId
                 ~ hcp_svc_want | dict2items | map(attribute='key')
                   | zip(hcp_svc_want | dict2items | map(attribute='value'))
                   | map('join', ',') | map('regex_replace', '^', ' --namespace ') | join('')] }}
          register: hcp_svc_upd
          changed_when: true
          failed_when: hcp_svc_upd.rc != 0 or hcp_svc_upd.stdout is search('(?i)exception|error|usage:|cannot|invalid')
          when: hcp_svc_acct | length > 0 and hcp_svc_want != hcp_svc_have

        - name: The account as HCP has it now
          ansible.builtin.command:
            argv: "{{ hcp_bssh + [hcp_admin ~ ' userAccount list ' ~ hcp_tenant_name ~ ' | ' ~ hcp_to_json] }}"
          register: hcp_svc_users2
          changed_when: false

        - name: Check roles and permissions
          ansible.builtin.assert:
            that:
              - acct.roles | default('') | trim in ['', 'None', 'NONE']
              - hcp_svc_ns | map('extract', hcp_svc_uuid) | reject('in', acct.namespaceUUIDPermMap | default({}, true)) | list | length == 0
            fail_msg: "Not as wanted: roles {{ acct.roles | default('') }}, permissions {{ acct.namespaceUUIDPermMap | default({}) }}"
            quiet: true
          vars:
            acct: >-
              {{ (hcp_svc_users2.stdout | from_json).values() | selectattr('name', 'equalto', hcp_svc_user) | first }}

      always:
        - name: Close the back-end session
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/backend_close.yml"

    - name: Done
      ansible.builtin.debug:
        msg:
          - >-
            {{ hcp_tenant_name }}/{{ hcp_svc_user }}: {{ 'created' if hcp_svc_acct | length == 0 else 'existing' }},
            no roles, {{ hcp_svc_perms | join(', ') }} on {{ hcp_svc_ns | join(', ') }}.
          - "S3 endpoints: {{ hcp_svc_ns | map('regex_replace', '$', '.' ~ hcp_tenant_name ~ '.' ~ hcp_clname) | join(', ') }} (HTTPS)"
          - >-
            S3 access key: {{ hcp_svc_user | b64encode }}. Secret key: the account's password hashed
            with {{ hcp_svc_hash_scheme if hcp_svc_acct | length == 0 else hcp_svc_acct.passwordHashScheme | default('its hash scheme') }}
            (not shown).
