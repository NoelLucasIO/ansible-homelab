---
# Creates/updates in AAP (controller API, built-in modules only):
#   * credential type "HCP VM secrets" (NIOS API password, HCP root SSH key file)
#   * job templates "HCP VM deploy", "HCP VM destroy", "HCP post-install" (all post-install
#     steps), and one per step: "HCP first-login", "HCP Prometheus", "HCP tenant",
#     "HCP node_exporter" (each with a survey)
#   * workflow "HCP VM deploy + post-install" (deploy, then all post-install steps on success)
# Idempotent: rerun after changing defaults to refresh the surveys.
#
#   ansible-playbook hcp-vm/playbooks/aap-setup.yml -e @site-vars.yml -e @aap.local.yml
#   aap.local.yml (git-ignored): aap_url, and aap_token (an AAP API token: user menu ->
#   API tokens, write scope) or aap_user + aap_password where the gateway allows Basic auth.
#
# Survey defaults come from the hcp_vm_defaults role overlaid with your site values, so the
# launch page opens pre-filled with your lab's addresses. Afterwards, create one credential of
# type "HCP VM secrets" and attach it (with the machine credential) to the templates.
- name: AAP job templates for hcp-vm
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - hcp_vm_defaults
  vars:
    aap_api: "{{ aap_url }}/api/controller/v2"
    aap_project: homelab
    aap_inventory: homelab
    aap_kvm_hosts: [fedora, p620ai]
    aap_secrets_credential: ""            # name of the "HCP VM secrets" credential, if it exists already
    aap_machine_credential: ""            # name of the machine credential for the KVM hosts
    aap_ee: ""                            # execution environment name; blank = project/org default
    aap_sv: "{{ playbook_dir }}/../templates/aap"
  module_defaults:
    ansible.builtin.uri:
      # Token if given (AAP 2.5+ gateways may refuse Basic auth on the API), else Basic.
      headers: "{{ {'Authorization': 'Bearer ' ~ aap_token} if aap_token | default('') | length > 0 else omit }}"
      user: "{{ omit if aap_token | default('') | length > 0 else aap_user }}"
      password: "{{ omit if aap_token | default('') | length > 0 else aap_password }}"
      force_basic_auth: "{{ aap_token | default('') | length == 0 }}"
      validate_certs: "{{ aap_validate_certs | default(false) }}"
      body_format: json
      return_content: true
      status_code: [200, 201, 204]
  tasks:
    - name: AAP connection settings given
      ansible.builtin.assert:
        that:
          - aap_url is defined
          - aap_token | default('') | length > 0 or (aap_user is defined and aap_password is defined)
        fail_msg: "Set aap_url and either aap_token or aap_user + aap_password (e.g. in a git-ignored aap.local.yml)."

    - name: Who am I in AAP? (fails fast on bad credentials)
      ansible.builtin.uri:
        url: "{{ aap_api }}/me/"
      register: aap_me

    - name: Connected
      ansible.builtin.debug:
        msg: "Connected to {{ aap_url }} as {{ aap_me.json.results[0].username }}"

    # --- credential type -----------------------------------------------------------
    - name: Credential type exists?
      ansible.builtin.uri:
        url: "{{ aap_api }}/credential_types/?name={{ 'HCP VM secrets' | urlencode }}"
      register: aap_ct

    - name: Create or update the credential type
      ansible.builtin.uri:
        url: "{{ aap_api }}/credential_types/{{ (aap_ct.json.results[0].id ~ '/') if aap_ct.json.count else '' }}"
        method: "{{ 'PATCH' if aap_ct.json.count else 'POST' }}"
        body:
          name: HCP VM secrets
          kind: cloud
          description: NIOS API password and HCP root SSH key for hcp-vm
          inputs:
            fields:
              - {id: nios_api_password, label: NIOS API password, type: string, secret: true}
              - {id: hcp_root_key, label: HCP root SSH private key, type: string, secret: true, multiline: true}
            required: [nios_api_password, hcp_root_key]
          injectors:
            file:
              template.hcp_root_key: "{% raw %}{{ hcp_root_key }}{% endraw %}\n"
            extra_vars:
              nios_api_password: "{% raw %}{{ nios_api_password }}{% endraw %}"
              hcp_root_key_file: "{% raw %}{{ tower.filename.hcp_root_key }}{% endraw %}"
      changed_when: true

    # --- lookups ---------------------------------------------------------------------
    - name: Project and inventory ids
      ansible.builtin.uri:
        url: "{{ aap_api }}/{{ item.kind }}/?name={{ item.name | urlencode }}"
      loop:
        - {kind: projects, name: "{{ aap_project }}"}
        - {kind: inventories, name: "{{ aap_inventory }}"}
      register: aap_ids

    - name: Both found
      ansible.builtin.assert:
        that: aap_ids.results | map(attribute='json.count') | min > 0
        fail_msg: "Project '{{ aap_project }}' or inventory '{{ aap_inventory }}' not found in AAP."

    # Templates can only point at playbooks AAP has already pulled: sync the project first.
    - name: Sync project {{ aap_project }}
      ansible.builtin.uri:
        url: "{{ aap_api }}/projects/{{ aap_ids.results[0].json.results[0].id }}/update/"
        method: POST
        status_code: [202]
      register: aap_sync
      changed_when: true

    - name: Wait for the sync
      ansible.builtin.uri:
        url: "{{ aap_api }}/project_updates/{{ aap_sync.json.id }}/"
      register: aap_sync_job
      until: aap_sync_job.json.status in ['successful', 'failed', 'error', 'canceled']
      retries: 60
      delay: 5

    - name: Playbooks the project offers
      ansible.builtin.uri:
        url: "{{ aap_api }}/projects/{{ aap_ids.results[0].json.results[0].id }}/playbooks/"
      register: aap_playbooks

    - name: The project has hcp-vm
      ansible.builtin.assert:
        that:
          - aap_sync_job.json.status == 'successful'
          - "'hcp-vm/playbooks/deploy.yml' in aap_playbooks.json"
        fail_msg: >-
          Project '{{ aap_project }}' sync {{ aap_sync_job.json.status }}; it pulls from
          {{ aap_ids.results[0].json.results[0].scm_url }} (branch
          '{{ aap_ids.results[0].json.results[0].scm_branch | default('', true) or 'default' }}'),
          which has no hcp-vm/playbooks/deploy.yml. Point aap_project at a project that syncs the
          repo containing hcp-vm.

    - name: Execution environment id
      ansible.builtin.uri:
        url: "{{ aap_api }}/execution_environments/?name={{ aap_ee | urlencode }}"
      register: aap_ee_q
      when: aap_ee | length > 0

    # --- surveys -----------------------------------------------------------------------
    # Fragments per playbook; chain=true makes the optional steps (tenant, node_exporter)
    # skippable. Combined surveys drop repeated variables (the later question wins, in the
    # earlier one's place).
    - name: Survey fragments
      ansible.builtin.set_fact:
        aap_s: >-
          {{ {'deploy': lookup('ansible.builtin.template', aap_sv ~ '/survey-deploy.yml.j2') | from_yaml,
              'destroy': lookup('ansible.builtin.template', aap_sv ~ '/survey-destroy.yml.j2') | from_yaml,
              'target': lookup('ansible.builtin.template', aap_sv ~ '/survey-target.yml.j2') | from_yaml,
              'first_login': lookup('ansible.builtin.template', aap_sv ~ '/survey-first-login.yml.j2') | from_yaml,
              'prometheus': lookup('ansible.builtin.template', aap_sv ~ '/survey-prometheus.yml.j2') | from_yaml,
              'tenant': lookup('ansible.builtin.template', aap_sv ~ '/survey-tenant.yml.j2') | from_yaml,
              'tenant_opt': lookup('ansible.builtin.template', aap_sv ~ '/survey-tenant.yml.j2',
                                   template_vars={'chain': true}) | from_yaml,
              'node_exporter': lookup('ansible.builtin.template', aap_sv ~ '/survey-node-exporter.yml.j2') | from_yaml,
              'node_exporter_opt': lookup('ansible.builtin.template', aap_sv ~ '/survey-node-exporter.yml.j2',
                                          template_vars={'chain': true}) | from_yaml,
              'prom_target': lookup('ansible.builtin.template', aap_sv ~ '/survey-prometheus-target.yml.j2') | from_yaml} }}

    - name: Combined surveys
      ansible.builtin.set_fact:
        aap_s_chain: "{{ dict(aap_chain | map(attribute='variable') | zip(aap_chain)).values() | list }}"
        aap_s_workflow: "{{ dict(aap_wf | map(attribute='variable') | zip(aap_wf)).values() | list }}"
      vars:
        aap_chain: "{{ aap_s.target + aap_s.first_login + aap_s.prometheus + aap_s.tenant_opt + aap_s.node_exporter_opt + aap_s.prom_target }}"
        aap_wf: "{{ aap_s.deploy + aap_s.first_login + aap_s.prometheus + aap_s.tenant_opt + aap_s.node_exporter_opt + aap_s.prom_target }}"

    # --- job templates ---------------------------------------------------------------
    - name: Create or update the job templates
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/aap_job_template.yml"
      loop:
        - name: HCP VM deploy
          playbook: hcp-vm/playbooks/deploy.yml
          description: Single-node HCP VM on KVM from the HCP ISO, NIOS IPAM + delegation, unattended install
          survey: "{{ aap_s.deploy }}"
        - name: HCP VM destroy
          playbook: hcp-vm/playbooks/destroy.yml
          description: Remove an hcp-vm VM, its disks, its NIOS objects and its Prometheus targets
          survey: "{{ aap_s.destroy + aap_s.prom_target }}"
        - name: HCP post-install
          playbook: hcp-vm/playbooks/post_install.yml
          description: All post-install steps in order (first-login, Prometheus, tenant, node_exporter)
          survey: "{{ aap_s_chain }}"
        - name: HCP first-login
          playbook: hcp-vm/playbooks/first_login.yml
          description: First-login setup of a new HCP system (security account, SSH, MAPI)
          survey: "{{ aap_s.target + aap_s.first_login }}"
        - name: HCP Prometheus
          playbook: hcp-vm/playbooks/prometheus.yml
          description: Turn HCP's built-in Prometheus on (or off)
          survey: "{{ aap_s.target + aap_s.prometheus }}"
        - name: HCP tenant
          playbook: hcp-vm/playbooks/tenant.yml
          description: Create a tenant (quota, no namespace quota) and set its namespace defaults
          survey: "{{ aap_s.target + aap_s.tenant }}"
        - name: HCP node_exporter
          playbook: hcp-vm/playbooks/node_exporter.yml
          description: node_exporter on the HCP node, firewalled to the listed scrapers, registered with Prometheus
          survey: "{{ aap_s.target + aap_s.node_exporter + aap_s.prom_target }}"
      loop_control:
        loop_var: aap_jt
        label: "{{ aap_jt.name }}"

    # --- workflow: deploy, then post-install ------------------------------------------
    - name: Workflow, deploy then first-login setup
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/aap_workflow.yml"
      vars:
        aap_wf_name: HCP VM deploy + post-install
        aap_wf_survey: "{{ aap_s_workflow }}"
