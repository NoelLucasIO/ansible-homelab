---
# HCP's built-in Prometheus: System Management Console > Monitoring > Prometheus >
# "Enable Prometheus". The checkbox is the cluster setting prometheus.server.enabled; HCP then
# runs its own Prometheus server (:9097 on the node, console at https://admin.<system>:9094).
# Also sets TSDB retention time and size (prometheus.storage.tsdb.retention.days / .size.gb).
# HCP writes them into the server's command line when it starts the server, so they are set
# before it is turned on; if a running server still has old values, it is turned off and on.
#   ansible-playbook playbooks/prometheus.yml -e hcp_kvm_host=fedora -e hcp_cluster=hcp02 \
#     -e hcp_backend_ip=198.51.100.101            # -e hcp_prometheus=false turns it off
# Runs over the back-end like first_login.yml, so it doesn't need front-end SSH. Rerun-safe.
- name: HCP Prometheus
  hosts: "{{ hcp_kvm_host | default('fedora') }}"
  become: true
  gather_facts: false
  roles:
    - hcp_vm_defaults
  tasks:
    - name: Check inputs
      ansible.builtin.assert:
        that:
          - hcp_cluster is match('^[a-z][a-z0-9-]{0,30}$')
          - hcp_backend_ip is match('^(\d{1,3}\.){3}\d{1,3}$')
          - hcp_root_key_file is defined
          - hcp_prometheus_retention_days | int >= 1 and hcp_prometheus_retention_days | int <= 365
          - hcp_prometheus_retention_gb | int >= 1 and hcp_prometheus_retention_gb | int <= 1000
        fail_msg: >-
          Need hcp_cluster, hcp_backend_ip and the HCP secrets credential (root key); TSDB
          retention 1-365 days and 1-1000 GB.

    - name: Wanted state
      ansible.builtin.set_fact:
        hcp_prom_want: "{{ hcp_prometheus | bool | string | lower }}"
        hcp_prom_settings:
          prometheus.storage.tsdb.retention.days: "{{ hcp_prometheus_retention_days | int }}"
          prometheus.storage.tsdb.retention.size.gb: "{{ hcp_prometheus_retention_gb | int }}"
        hcp_prom_args: >-
          --storage.tsdb.retention.time={{ hcp_prometheus_retention_days | int }}d
          --storage.tsdb.retention.size={{ hcp_prometheus_retention_gb | int }}GB

    - name: Set Prometheus over the back-end
      block:
        - name: Open a back-end session
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/backend_open.yml"

        - name: Prometheus, current setting (waits for HCP to be up)
          ansible.builtin.command:
            argv: "{{ hcp_bssh + [hcp_admin ~ ' config get cluster prometheus.server.enabled'] }}"
          register: hcp_prom_cfg
          until: hcp_prom_cfg.rc == 0 and hcp_prom_cfg.stdout is search('configValue')
          retries: 30
          delay: 20
          changed_when: false

        - name: Retention settings, current
          ansible.builtin.command:
            argv: "{{ hcp_bssh + [hcp_admin ~ ' config get cluster ' ~ item.key] }}"
          loop: "{{ hcp_prom_settings | dict2items }}"
          register: hcp_prom_ret
          changed_when: false

        - name: Retention settings
          ansible.builtin.command:
            argv: "{{ hcp_bssh + [hcp_admin ~ ' config set cluster ' ~ item.item.key ~ ' ' ~ item.item.value] }}"
          loop: "{{ hcp_prom_ret.results }}"
          loop_control:
            label: "{{ item.item.key }}={{ item.item.value }}"
          when: item.stdout is not search("'configValue'\s*:\s*'" ~ item.item.value ~ "'")
          changed_when: true

        - name: Prometheus {{ 'on' if hcp_prom_want == 'true' else 'off' }}
          ansible.builtin.command:
            argv: "{{ hcp_bssh + [hcp_admin ~ ' config set cluster prometheus.server.enabled ' ~ hcp_prom_want] }}"
          when: hcp_prom_cfg.stdout is not search("'configValue'\s*:\s*'" ~ hcp_prom_want ~ "'")
          changed_when: true

        - name: Prometheus server listening on the node
          ansible.builtin.command:
            argv: "{{ hcp_bssh + ['ss -ltn | grep -q \":9097 \"'] }}"
          register: hcp_prom_up
          until: hcp_prom_up.rc == 0
          retries: 24
          delay: 10
          changed_when: false
          when: hcp_prom_want == 'true'

        # The running server's command line shows the retention it was started with.
        - name: Server's retention flags
          ansible.builtin.command:
            argv: "{{ hcp_bssh + ['ps -eo args | grep -o \"[-]-storage.tsdb.retention.[a-z]*=[^ ]*\" | sort -ru | tr \"\\n\" \" \"'] }}"
          register: hcp_prom_flags
          changed_when: false
          when: hcp_prom_want == 'true'

        - name: Restart it with the new retention (off, then on)
          when:
            - hcp_prom_want == 'true'
            - hcp_prom_flags.stdout | trim != hcp_prom_args | trim
          block:
            - name: Prometheus off
              ansible.builtin.command:
                argv: "{{ hcp_bssh + [hcp_admin ~ ' config set cluster prometheus.server.enabled false'] }}"
              changed_when: true

            - name: Server stopped
              ansible.builtin.command:
                argv: "{{ hcp_bssh + ['! ss -ltn | grep -q \":9097 \"'] }}"
              register: hcp_prom_down
              until: hcp_prom_down.rc == 0
              retries: 24
              delay: 5
              changed_when: false

            - name: Prometheus on
              ansible.builtin.command:
                argv: "{{ hcp_bssh + [hcp_admin ~ ' config set cluster prometheus.server.enabled true'] }}"
              changed_when: true

            - name: Server back, with the new retention
              ansible.builtin.command:
                argv: "{{ hcp_bssh + ['ps -eo args | grep -o \"[-]-storage.tsdb.retention.[a-z]*=[^ ]*\" | sort -ru | tr \"\\n\" \" \"'] }}"
              register: hcp_prom_flags2
              until: hcp_prom_flags2.stdout | trim == hcp_prom_args | trim
              retries: 24
              delay: 10
              changed_when: false

      always:
        - name: Close the back-end session
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/backend_close.yml"

    - name: Done
      ansible.builtin.debug:
        msg: >-
          {{ hcp_clname }}: Prometheus {{ ('on, TSDB retention ' ~ hcp_prometheus_retention_days ~ ' days / '
          ~ hcp_prometheus_retention_gb ~ ' GB, console https://admin.' ~ hcp_clname ~ ':9094')
          if hcp_prom_want == 'true' else 'off' }}.
