---
# Initial tenant: create it (or bring its quotas in line), then set its namespace defaults.
#   ansible-playbook playbooks/tenant.yml -e hcp_kvm_host=fedora -e hcp_cluster=hcp02 \
#     -e hcp_backend_ip=198.51.100.101 -e hcp_tenant_name=lab -e hcp_tenant_quota=100 \
#     -e hcp_tenant_quota_unit=GB -e hcp_security_password=... -e hcp_tenant_admin_password=...
# The tenant is made through MAPI as the system 'security' account (needs MAPI on, see
# first_login.yml): MAPI is the documented way to say "namespace quota: none". Its first user
# (hcp_tenant_admin_user) gets the administrator and security roles.
# Namespace defaults are set with HCP's `admin jvm namespaceDefaults` over the back-end:
# protocol optimization (cloud protocols only) and directory usage (balanced).
# Rerun-safe: an existing tenant keeps its admin user and password; only quotas are updated.
- name: HCP initial tenant
  hosts: "{{ hcp_kvm_host | default('fedora') }}"
  become: true
  gather_facts: false
  roles:
    - hcp_vm_defaults
  vars:
    hcp_quota_gb: "{{ hcp_tenant_quota | float * (1024 if hcp_tenant_quota_unit | upper == 'TB' else 1) }}"
  tasks:
    - name: Check inputs
      ansible.builtin.assert:
        that:
          - hcp_cluster is match('^[a-z][a-z0-9-]{0,30}$')
          - hcp_backend_ip is match('^(\d{1,3}\.){3}\d{1,3}$')
          - hcp_root_key_file is defined
          - hcp_tenant_name is match('^[A-Za-z0-9][A-Za-z0-9-]{0,62}$')
          - hcp_tenant_quota | float > 0
          - hcp_tenant_quota_unit | upper in ['GB', 'TB']
          - hcp_tenant_soft_quota | int >= 10 and hcp_tenant_soft_quota | int <= 95
          - hcp_security_password | default('') | length > 0
          - hcp_tenant_admin_user is match('^[A-Za-z0-9][A-Za-z0-9._@-]{0,63}$')
          - hcp_tenant_admin_password | default('') | length > 0
          - hcp_ns_cloud_optimized | upper in ['CLOUD', 'ALL', 'DEFAULT']
          - hcp_ns_directory_usage | upper in ['BALANCED', 'UNBALANCED', 'DEFAULT']
        fail_msg: >-
          Need hcp_cluster, hcp_backend_ip, the HCP secrets credential, hcp_tenant_name (letters,
          digits, hyphens; up to 63), a quota above 0 in GB or TB, the security account password
          (for MAPI), and the tenant admin user and password.
      no_log: true

    - name: Tenant over MAPI, namespace defaults over the back-end
      block:
        - name: Open a back-end session
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/backend_open.yml"

        - name: MAPI settings
          ansible.builtin.set_fact:
            hcp_mapi: "https://{{ hcp_fe_ip }}:9090/mapi"
            hcp_mapi_auth: "HCP {{ hcp_security_user | b64encode }}:{{ hcp_security_password | hash('md5') }}"
            hcp_quota_str: "{{ '%.2f' | format(hcp_tenant_quota | float) }} {{ hcp_tenant_quota_unit | upper }}"
          no_log: true

        - name: Tenant exists?
          ansible.builtin.uri:
            url: "{{ hcp_mapi }}/tenants/{{ hcp_tenant_name }}?verbose=true"
            headers: {Authorization: "{{ hcp_mapi_auth }}", Accept: application/json}
            validate_certs: false
            status_code: [200, 404]
          register: hcp_t
          delegate_to: localhost
          become: false

        - name: Create the tenant
          ansible.builtin.uri:
            url: >-
              {{ hcp_mapi }}/tenants?username={{ hcp_tenant_admin_user | urlencode }}&password={{
              hcp_tenant_admin_password | urlencode }}&forcePasswordChange=false
            method: PUT
            headers: {Authorization: "{{ hcp_mapi_auth }}", Accept: application/json}
            body_format: json
            body: >-
              {{ {'name': hcp_tenant_name,
                  'systemVisibleDescription': hcp_tenant_description,
                  'hardQuota': hcp_quota_str,
                  'softQuota': hcp_tenant_soft_quota | int,
                  'namespaceQuota': 'None',
                  'versioningConfigurationEnabled': hcp_tenant_versioning | bool,
                  'complianceConfigurationEnabled': hcp_tenant_compliance | bool} }}
            validate_certs: false
            status_code: [200, 400, 403, 409]
          register: hcp_t_new
          delegate_to: localhost
          become: false
          no_log: true
          changed_when: hcp_t_new.status == 200
          when: hcp_t.status == 404

        - name: Tenant created
          ansible.builtin.assert:
            that: hcp_t_new.status == 200
            fail_msg: "MAPI refused the tenant ({{ hcp_t_new.status }}): {{ hcp_t_new.x_hcp_errormessage | default('no detail') }}"
          when: hcp_t.status == 404

        # Existing tenant: compare in GB (MAPI reports "<n.nn> GB|TB").
        - name: Quota changes for the existing tenant
          ansible.builtin.set_fact:
            hcp_t_update: >-
              {{ {}
                 | combine({'hardQuota': hcp_quota_str}
                           if (hcp_t.json.hardQuota.split()[0] | float
                               * (1024 if hcp_t.json.hardQuota is search('TB') else 1)
                               - hcp_quota_gb | float) | abs > 0.01 else {})
                 | combine({'softQuota': hcp_tenant_soft_quota | int}
                           if hcp_t.json.softQuota | int != hcp_tenant_soft_quota | int else {})
                 | combine({'namespaceQuota': 'None'}
                           if hcp_t.json.namespaceQuota | default('None') | string != 'None' else {}) }}
          when: hcp_t.status == 200

        - name: Update the tenant's quotas
          ansible.builtin.uri:
            url: "{{ hcp_mapi }}/tenants/{{ hcp_tenant_name }}"
            method: POST
            headers: {Authorization: "{{ hcp_mapi_auth }}", Accept: application/json}
            body_format: json
            body: "{{ hcp_t_update }}"
            validate_certs: false
            status_code: [200]
          delegate_to: localhost
          become: false
          changed_when: true
          when: hcp_t.status == 200 and hcp_t_update | length > 0

        # admin jvm prints the defaults as Python literals; compare before and after.
        - name: Namespace defaults, before
          ansible.builtin.command:
            argv: "{{ hcp_bssh + [hcp_admin ~ ' namespaceDefaults list ' ~ hcp_tenant_name] }}"
          register: hcp_nsd_before
          until: hcp_nsd_before.rc == 0 and hcp_nsd_before.stdout is not search('cannot be found')
          retries: 6
          delay: 10
          changed_when: false

        - name: Namespace defaults, set protocol optimization and directory usage
          ansible.builtin.command:
            argv: >-
              {{ hcp_bssh + [hcp_admin ~ ' namespaceDefaults update ' ~ hcp_tenant_name
                 ~ ' --cloudOptimized ' ~ hcp_ns_cloud_optimized | upper
                 ~ ' --directoryUsage ' ~ hcp_ns_directory_usage | upper] }}
          register: hcp_nsd_set
          changed_when: false
          failed_when: hcp_nsd_set.rc != 0 or hcp_nsd_set.stdout is search('(?i)error|exception|usage:')

        - name: Namespace defaults, after
          ansible.builtin.command:
            argv: "{{ hcp_bssh + [hcp_admin ~ ' namespaceDefaults list ' ~ hcp_tenant_name] }}"
          register: hcp_nsd_after
          changed_when: hcp_nsd_after.stdout != hcp_nsd_before.stdout

      always:
        - name: Close the back-end session
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/backend_close.yml"

    - name: Done
      ansible.builtin.debug:
        msg:
          - >-
            {{ hcp_clname }}: tenant '{{ hcp_tenant_name }}' {{ 'created' if hcp_t.status == 404 else 'present' }},
            hard quota {{ hcp_quota_str }}, soft {{ hcp_tenant_soft_quota }}%, namespace quota none.
          - "New namespaces default to protocol optimization {{ hcp_ns_cloud_optimized | upper }}, directory usage {{ hcp_ns_directory_usage | upper }}."
          - "Tenant console: https://{{ hcp_tenant_name }}.{{ hcp_clname }}:8000"
          - "{{ hcp_nsd_after.stdout_lines }}"
