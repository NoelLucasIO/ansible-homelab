---
# System-wide defaults for new namespaces: Configuration > Protocol Optimization and Directory
# Usage in the System Management Console. Runs right after first_login.yml, before tenants.
#   ansible-playbook playbooks/protocol_defaults.yml -e hcp_kvm_host=fedora -e hcp_cluster=hcp02 \
#     -e hcp_backend_ip=198.51.100.101
# The two radio groups are cluster settings: location.cloud.optimized (true = cloud protocols
# only) and location.unbalanced.directory.mode (true = unbalanced). HCP requires cloud
# optimization for unbalanced directories. Tenants can still set their own namespace defaults
# (tenant.yml). Rerun-safe.
#
# Limits that come with the choice (HCP 10.1):
#   directories per node: 1,500,000 if any namespace is not cloud-optimized, 15,000,000 if all are
#   objects per directory: no limit with unbalanced directories, 30,000,000 with balanced
- name: HCP protocol optimization and directory usage defaults
  hosts: "{{ hcp_kvm_host | default('fedora') }}"
  become: true
  gather_facts: false
  roles:
    - hcp_vm_defaults
  vars:
    hcp_pd_want:
      location.cloud.optimized: "{{ hcp_sys_cloud_optimized | bool | string | lower }}"
      location.unbalanced.directory.mode: "{{ hcp_sys_unbalanced_dirs | bool | string | lower }}"
  tasks:
    - name: Check inputs
      ansible.builtin.assert:
        that:
          - hcp_cluster is match('^[a-z][a-z0-9-]{0,30}$')
          - hcp_backend_ip is match('^(\d{1,3}\.){3}\d{1,3}$')
          - hcp_root_key_file is defined
          - hcp_sys_cloud_optimized | bool or not hcp_sys_unbalanced_dirs | bool
        fail_msg: >-
          Need hcp_cluster, hcp_backend_ip and the HCP secrets credential. Unbalanced directories
          need cloud-protocol optimization (HCP's rule).
        quiet: true

    - name: Set the defaults over the back-end
      block:
        - name: Open a back-end session
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/backend_open.yml"

        - name: Current settings (waits for HCP to be up)
          ansible.builtin.command:
            argv: "{{ hcp_bssh + [hcp_admin ~ ' config get cluster ' ~ item.key] }}"
          loop: "{{ hcp_pd_want | dict2items }}"
          register: hcp_pd_cur
          until: hcp_pd_cur.rc == 0 and hcp_pd_cur.stdout is search('configValue')
          retries: 30
          delay: 20
          changed_when: false

        # Cloud optimization first: HCP doesn't allow unbalanced without it.
        - name: Set what differs
          ansible.builtin.command:
            argv: "{{ hcp_bssh + [hcp_admin ~ ' config set cluster ' ~ item.item.key ~ ' ' ~ item.item.value] }}"
          loop: "{{ hcp_pd_cur.results }}"
          loop_control:
            label: "{{ item.item.key }}={{ item.item.value }}"
          when: item.stdout is not search("'configValue'\\s*:\\s*'" ~ item.item.value ~ "'")
          changed_when: true

      always:
        - name: Close the back-end session
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/backend_close.yml"

    - name: Done
      ansible.builtin.debug:
        msg: >-
          {{ hcp_clname }}: new namespaces default to
          {{ 'cloud protocols only' if hcp_sys_cloud_optimized | bool else 'all protocols' }},
          {{ 'unbalanced' if hcp_sys_unbalanced_dirs | bool else 'balanced' }} directory usage.
