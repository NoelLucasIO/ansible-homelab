---
# Services the HCP OS starts for physical nodes that a VM can't run (no BMC: ipmi.service fails at
# every boot and shows as a failed unit in monitoring). Disables them and clears their failed state.
#   ansible-playbook playbooks/vm_services.yml -e hcp_kvm_host=fedora -e hcp_cluster=hcp02 \
#     -e hcp_backend_ip=198.51.100.101
# Units: hcp_vm_disable_units. Units the node doesn't have are skipped. Rerun-safe.
# Note: an HCP upgrade may re-enable them; rerun this playbook (or post_install.yml) afterwards.
- name: HCP services a VM can't use
  hosts: "{{ hcp_kvm_host | default('fedora') }}"
  become: true
  gather_facts: false
  roles:
    - hcp_vm_defaults
  tasks:
    - name: Check inputs
      ansible.builtin.assert:
        that:
          - hcp_cluster is match('^[a-z][a-z0-9-]{0,30}$')
          - hcp_backend_ip is match('^(\d{1,3}\.){3}\d{1,3}$')
          - hcp_root_key_file is defined
          - hcp_vm_disable_units | reject('match', '^[A-Za-z0-9@._-]+[.](service|timer|socket)$') | list | length == 0
        fail_msg: "Need hcp_cluster, hcp_backend_ip and the HCP secrets credential; unit names like ipmi.service."
        quiet: true

    - name: On the node
      when: hcp_vm_disable_units | length > 0
      block:
        - name: Open a back-end session
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/backend_open.yml"

        # One line per unit: <unit> <enabled-state|absent> <active-state>
        - name: Current state
          ansible.builtin.command:
            argv: "{{ hcp_bssh + [hcp_cmd] }}"
          vars:
            hcp_cmd: >-
              for u in {{ hcp_vm_disable_units | join(' ') }}; do
              if systemctl cat "$u" >/dev/null 2>&1; then
              echo "$u $(systemctl is-enabled "$u" 2>/dev/null || true) $(systemctl is-active "$u" 2>/dev/null || true)";
              else echo "$u absent -"; fi; done
          register: hcp_vs_state
          changed_when: false

        - name: Units to change
          ansible.builtin.set_fact:
            hcp_vs_todo: >-
              {{ hcp_vs_state.stdout_lines | map('split') | rejectattr(1, 'equalto', 'absent')
                 | selectattr(1, 'in', ['enabled', 'static', 'indirect', 'generated', 'enabled-runtime'])
                 | map('first') | list
                 + hcp_vs_state.stdout_lines | map('split') | selectattr(2, 'equalto', 'failed')
                 | map('first') | list }}

        - name: Disable, stop and clear {{ hcp_vs_todo | unique | join(', ') }}
          ansible.builtin.command:
            argv: "{{ hcp_bssh + [hcp_cmd] }}"
          vars:
            hcp_cmd: >-
              for u in {{ hcp_vs_todo | unique | join(' ') }}; do
              systemctl disable --now "$u" 2>/dev/null || true;
              systemctl reset-failed "$u" 2>/dev/null || true; done
          when: hcp_vs_todo | length > 0
          changed_when: true

        - name: Failed units on the node
          ansible.builtin.command:
            argv: "{{ hcp_bssh + [\"systemctl --failed --no-legend --plain | awk '{print $1}'\"] }}"
          register: hcp_vs_failed
          changed_when: false

        - name: Result
          ansible.builtin.debug:
            msg:
              - "Before: {{ hcp_vs_state.stdout_lines }}"
              - "Changed: {{ hcp_vs_todo | unique if hcp_vs_todo | length > 0 else 'nothing (already disabled)' }}"
              - "Failed units on the node now: {{ hcp_vs_failed.stdout_lines if hcp_vs_failed.stdout_lines | length > 0 else 'none' }}"

      always:
        - name: Close the back-end session
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/backend_close.yml"
          when: hcp_vm_disable_units | length > 0
