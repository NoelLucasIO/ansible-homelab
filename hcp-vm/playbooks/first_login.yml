---
# First-login setup of a new HCP system, the steps the System Management Console asks for:
# security account password and roles, SSH on the front-end, MAPI on.
#   ansible-playbook playbooks/first_login.yml -e hcp_kvm_host=fedora -e hcp_cluster=hcp02 \
#     -e hcp_backend_ip=198.51.100.101 -e hcp_security_password=...
# A new system has front-end SSH off, so this runs from the hypervisor over the back-end
# (tasks/backend_open.yml) with HCP's own `admin jvm` commands.
# Safe to rerun: the password is only set while HCP still demands a change, the rest only
# when it differs.
- name: HCP first-login setup
  hosts: "{{ hcp_kvm_host | default('fedora') }}"
  become: true
  gather_facts: false
  roles:
    - hcp_vm_defaults
  tasks:
    # Roles may come as a list, a comma-separated string, or an AAP multiselect (newlines).
    - name: Normalise the roles
      ansible.builtin.set_fact:
        hcp_roles: >-
          {{ (hcp_security_roles if hcp_security_roles is not string
              else hcp_security_roles | regex_replace('\n', ',') | split(','))
             | map('trim') | reject('equalto', '') | unique | sort }}

    - name: Check inputs
      ansible.builtin.assert:
        that:
          - hcp_cluster is match('^[a-z][a-z0-9-]{0,30}$')
          - hcp_backend_ip is match('^(\d{1,3}\.){3}\d{1,3}$')
          - hcp_security_password is defined
          - hcp_security_password | length >= 14
          - hcp_root_key_file is defined
          - hcp_roles | length > 0
          - hcp_roles | difference(hcp_security_role_choices) | length == 0
        fail_msg: >-
          Need hcp_cluster, hcp_backend_ip, a 14+ character hcp_security_password, the HCP secrets
          credential (root key), and security roles from {{ hcp_security_role_choices | join(', ') }}.
      no_log: true

    - name: Run the setup over the back-end
      block:
        - name: Open a back-end session
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/backend_open.yml"

        # admin jvm prints Python literals; the node's python turns them into JSON.
        - name: Security account (waits for HCP to be up)
          ansible.builtin.command:
            argv: "{{ hcp_bssh + [hcp_admin ~ ' userAccount list cluster | ' ~ hcp_to_json] }}"
          vars:
            hcp_to_json: >-
              python -c 'import sys,ast,json; print(json.dumps(ast.literal_eval(sys.stdin.read())))'
          register: hcp_accounts
          until: hcp_accounts.rc == 0
          retries: 30
          delay: 20
          changed_when: false

        - name: Pick the security account
          ansible.builtin.set_fact:
            hcp_sec: "{{ (hcp_accounts.stdout | from_json).values() | selectattr('name', 'equalto', hcp_security_user) | first }}"

        - name: Cluster UUID
          ansible.builtin.set_fact:
            hcp_cluster_uuid: "{{ hcp_sec.parentUUID }}"

        - name: Set the security password (only while HCP still demands a change)
          ansible.builtin.command:
            argv: "{{ hcp_bssh + [hcp_set_pw] }}"
          vars:
            hcp_set_pw: >-
              {{ hcp_admin }} userAccount update cluster {{ hcp_sec.userId }}
              --password {{ hcp_security_password | quote }} --forcePasswordChange false
          when: hcp_sec.isPasswordChangeRequired | bool or hcp_sec.isPasswordExpired | bool
          no_log: true
          changed_when: true

        - name: Security roles {{ hcp_roles | join(',') }}
          ansible.builtin.command:
            argv: "{{ hcp_bssh + [hcp_admin ~ ' userAccount update cluster ' ~ hcp_sec.userId ~ ' --roles ' ~ hcp_roles | join(',')] }}"
          when: (hcp_sec.roles.split(',') | sort) != hcp_roles
          changed_when: true

        - name: SSH on the front-end, current setting
          ansible.builtin.command:
            argv: "{{ hcp_bssh + [hcp_admin ~ ' config get cluster ssh.enabled'] }}"
          register: hcp_ssh_cfg
          changed_when: false
          when: hcp_enable_ssh | bool

        - name: Turn SSH on
          ansible.builtin.command:
            argv: "{{ hcp_bssh + [hcp_admin ~ ' config set cluster ssh.enabled true'] }}"
          when:
            - hcp_enable_ssh | bool
            - "\"'true'\" not in hcp_ssh_cfg.stdout"
          changed_when: true

        - name: MAPI, current setting
          ansible.builtin.command:
            argv: "{{ hcp_bssh + [hcp_admin ~ ' gateway mapi status ' ~ hcp_cluster_uuid] }}"
          register: hcp_mapi_cfg
          changed_when: false
          when: hcp_enable_mapi | bool

        - name: Turn MAPI on
          ansible.builtin.command:
            argv: "{{ hcp_bssh + [hcp_admin ~ ' gateway mapi start ' ~ hcp_cluster_uuid] }}"
          when:
            - hcp_enable_mapi | bool
            - hcp_mapi_cfg.stdout is not search('mapi.enabled\s*:\s*true')
          changed_when: true

      always:
        - name: Close the back-end session
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/backend_close.yml"

    # --- Checks from the controller, through the front-end -----------------------------
    - name: SSH answers on the front-end
      ansible.builtin.wait_for:
        host: "{{ hcp_fe_ip }}"
        port: 22
        timeout: 180
      delegate_to: localhost
      become: false
      when: hcp_enable_ssh | bool

    # MAPI auth header: HCP base64(user):md5(password). A 200 proves the password and MAPI together.
    - name: MAPI accepts the security account
      ansible.builtin.uri:
        url: "https://{{ hcp_fe_ip }}:9090/mapi/tenants"
        headers:
          Authorization: "HCP {{ hcp_security_user | b64encode }}:{{ hcp_security_password | hash('md5') }}"
          Accept: application/json
        validate_certs: false
        status_code: [200]
      register: hcp_mapi_check
      until: hcp_mapi_check.status == 200
      retries: 12
      delay: 10
      delegate_to: localhost
      become: false
      no_log: true
      when: hcp_enable_mapi | bool

    - name: Done
      ansible.builtin.debug:
        msg:
          - "{{ hcp_clname }}: security account '{{ hcp_security_user }}' roles {{ hcp_roles | join(',') }}."
          - "SSH on the front-end: {{ 'on' if hcp_enable_ssh | bool else 'left as is' }}."
          - "MAPI: {{ 'on, security login checked' if hcp_enable_mapi | bool else 'left as is' }}."
          - "Console: https://admin.{{ hcp_clname }}:8000  MAPI: https://admin.{{ hcp_clname }}:9090/mapi"
