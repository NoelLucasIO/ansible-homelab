---
# Validate the survey, derive names, and check the hypervisor has what it needs.
- name: Check inputs
  ansible.builtin.assert:
    that:
      - hcp_cluster is match('^[a-z][a-z0-9-]{0,30}$')
      - hcp_backend_ip is match('^(\d{1,3}\.){3}\d{1,3}$')
      - (hcp_backend_ip.split('.')[-1] | int) >= 101
      - (hcp_backend_ip.split('.')[-1] | int) <= 254
      - hcp_frontend_ip | length == 0 or hcp_frontend_ip is match('^(\d{1,3}\.){3}\d{1,3}$')
      - hcp_frontend_prefix | int >= 8
      - hcp_frontend_prefix | int <= 30
      - hcp_frontend_ip | length > 0 or hcp_use_nios | bool
      - hcp_vcpus | int >= 4
      - hcp_memory_gb | int >= 32
      - hcp_os_disk_gb | int >= 100
      - hcp_data_disk_gb | int >= 500
      - hcp_data_disk_count | int >= 2
      - hcp_data_disk_count | int <= 8
      - hcp_install_password is defined
      - hcp_install_password | length >= 14
      - hcp_root_key_file is defined
    fail_msg: >-
      Check the survey: cluster name lowercase; back-end IP last octet 101-254 (it becomes the node
      number); front-end IP blank (NIOS) or an IPv4 address; at least 4 vCPU / 32 GB / 100 GB OS /
      2 x 500 GB data; install password 14+ characters; and the HCP secrets credential attached
      (it supplies the root SSH key file).
  no_log: true    # the expression list includes the passwords

- name: Derive names
  ansible.builtin.set_fact:
    hcp_clname: "{{ hcp_cluster }}.{{ hcp_domain }}"
    hcp_domain_name: "{{ hcp_vm_name if hcp_vm_name | length > 0 else hcp_cluster | upper }}"
    hcp_node_number: "{{ hcp_backend_ip.split('.')[-1] }}"
    hcp_node_fqdn: "{{ hcp_hostname_prefix }}{{ hcp_backend_ip.split('.')[-1] }}.{{ hcp_cluster }}.{{ hcp_domain }}"
    hcp_frontend_mask: >-
      {%- set p = hcp_frontend_prefix | int -%}
      {%- for i in range(4) -%}
      {{ 256 - 2 ** (8 - ([0, [8, p - 8 * i] | min] | max)) }}{{ '.' if not loop.last else '' }}{%- endfor -%}

- name: Disk paths and fixed MACs (52:54:00 = QEMU/KVM prefix)
  ansible.builtin.set_fact:
    hcp_disks: >-
      {{ [hcp_os_disk_dir ~ '/' ~ hcp_domain_name | lower ~ '-os.qcow2']
         + range(1, hcp_data_disk_count | int + 1)
           | map('string') | map('regex_replace', '^(\d)$', '0\1')
           | map('regex_replace', '^(.*)$', hcp_data_disk_dir ~ '/' ~ hcp_domain_name | lower ~ '-data\1.qcow2') | list }}
    hcp_macs: >-
      {{ ['fe', 'be'] | map('regex_replace', '^(.*)$', hcp_domain_name ~ '-\1') | map('hash', 'md5')
         | map('regex_replace', '^(..)(..)(..).*$', '52:54:00:\1:\2:\3') | list }}

- name: ISO present on {{ inventory_hostname }}
  ansible.builtin.stat:
    path: "{{ hcp_iso_path }}"
    get_checksum: false
  register: hcp_iso

- name: Tools present on {{ inventory_hostname }}
  ansible.builtin.command: sh -c 'command -v virt-install && command -v virsh && command -v qemu-img && command -v qemu-nbd && command -v python3'
  register: hcp_tools
  changed_when: false
  failed_when: false

- name: Hypervisor ready
  ansible.builtin.assert:
    that:
      - hcp_iso.stat.exists
      - hcp_tools.rc == 0
    fail_msg: >-
      {{ inventory_hostname }}: need {{ hcp_iso_path }} (copy the HCP ISO there or set hcp_iso_path in
      host_vars) and virt-install, virsh, qemu-img, qemu-nbd, python3 on PATH.

# A host reboot without libvirt-guests kills the VM: HCP's var0 and data disks need fsck, and
# a killed data disk loses objects. bootstrap-host.yml sets it up (bootstrap_libvirt_guests).
- name: Clean guest shutdown on host reboot (libvirt-guests unit)
  ansible.builtin.systemd_service:
    name: libvirt-guests.service
  register: hcp_lg_unit
  failed_when: false

- name: Clean guest shutdown on host reboot (libvirt-guests config)
  ansible.builtin.command: grep -hqs '^ON_SHUTDOWN=shutdown' /etc/sysconfig/libvirt-guests /etc/conf.d/libvirt-guests
  register: hcp_lg
  changed_when: false
  failed_when: false

- name: The hypervisor shuts guests down on reboot
  ansible.builtin.assert:
    that: >-
      (hcp_lg_unit.status.UnitFileState | default('') == 'enabled' and hcp_lg.rc == 0)
      or not hcp_require_libvirt_guests | bool
    fail_msg: >-
      {{ inventory_hostname }}: libvirt-guests isn't enabled with ON_SHUTDOWN=shutdown, so a host
      reboot would kill HCP and can corrupt its disks. Run bootstrap-host.yml with
      bootstrap_libvirt_guests: true for this host (or set hcp_require_libvirt_guests: false).
    quiet: true

- name: Does the domain exist?
  ansible.builtin.command: virsh domstate {{ hcp_domain_name }}
  register: hcp_domstate
  changed_when: false
  failed_when: false

- name: Plan
  ansible.builtin.debug:
    msg: >-
      {{ hcp_domain_name }} on {{ inventory_hostname }}: {{ hcp_vcpus }} vCPU, {{ hcp_memory_gb }} GB,
      OS {{ hcp_os_disk_gb }} GB + {{ hcp_data_disk_count }} x {{ hcp_data_disk_gb }} GB.
      System {{ hcp_clname }}, node {{ hcp_node_fqdn }}, back-end {{ hcp_backend_ip }}.
      Domain {{ 'exists (' ~ hcp_domstate.stdout ~ ')' if hcp_domstate.rc == 0 else 'is new' }};
      replace={{ hcp_replace | bool }}.
