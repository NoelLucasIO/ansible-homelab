---
# Open a root session to the HCP node over the isolated back-end network, from the hypervisor.
# A new system has front-end SSH off, and root's authorized_keys_be holds the HCP root key, so
# the hypervisor briefly gets an address on the back-end bridge and runs ssh/scp from there.
# Always pair with backend_close.yml in an `always:` section.
# Sets: hcp_bssh (ssh argv prefix), hcp_bscp (scp argv prefix), hcp_admin, hcp_clname,
#       hcp_fe_ip (the node's front-end address).
- name: Root SSH key (repairs a pasted key's lost line breaks)
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/root_key.yml"

- name: Names
  ansible.builtin.set_fact:
    hcp_clname: "{{ hcp_cluster }}.{{ hcp_domain }}"
    hcp_bridge_ip: "{{ hcp_backend_host_ip if hcp_backend_host_ip | length > 0 else hcp_backend_ip.split('.')[:3] | join('.') ~ '.1' }}"
    hcp_key_on_host: "{{ hcp_log_dir }}/.hcp-root-key"
    hcp_ssh_opts: [-i, "{{ hcp_log_dir }}/.hcp-root-key", -o, BatchMode=yes, -o, ConnectTimeout=10,
                   -o, ServerAliveInterval=15, -o, StrictHostKeyChecking=no,
                   -o, UserKnownHostsFile=/dev/null, -o, LogLevel=ERROR]
    hcp_admin: /opt/arc/bin/admin jvm

- name: Back-end bridge
  ansible.builtin.shell: set -o pipefail; virsh net-info {{ hcp_backend_network }} | awk '/^Bridge:/{print $2}'
  args:
    executable: /bin/bash
  register: hcp_br
  changed_when: false

- name: Does the hypervisor already have an address on it?
  ansible.builtin.command: ip -4 -o addr show dev {{ hcp_br.stdout }}
  register: hcp_br_addr
  changed_when: false

- name: Temporary hypervisor address on the back-end bridge
  ansible.builtin.command: ip addr add {{ hcp_bridge_ip }}/24 dev {{ hcp_br.stdout }}
  when: (hcp_bridge_ip ~ '/') not in hcp_br_addr.stdout
  register: hcp_br_added
  changed_when: true

- name: HCP root key on the hypervisor (removed afterwards)
  ansible.builtin.copy:
    src: "{{ hcp_key_path }}"
    dest: "{{ hcp_key_on_host }}"
    mode: "0600"

- name: SSH and SCP prefixes (back-end)
  ansible.builtin.set_fact:
    hcp_bssh: "{{ ['ssh'] + hcp_ssh_opts + ['root@' ~ hcp_backend_ip] }}"
    hcp_bscp: "{{ ['scp', '-q'] + hcp_ssh_opts }}"

- name: Node answers over the back-end (waits while HCP boots)
  ansible.builtin.command:
    argv: "{{ hcp_bssh + ['true'] }}"
  register: hcp_b_up
  until: hcp_b_up.rc == 0
  retries: 30
  delay: 20
  changed_when: false

- name: Front-end address
  ansible.builtin.command:
    argv: "{{ hcp_bssh + [\"ip -4 -o addr show eth0 | awk '{print $4}' | cut -d/ -f1\"] }}"
  register: hcp_fe
  changed_when: false

- name: Remember it
  ansible.builtin.set_fact:
    hcp_fe_ip: "{{ hcp_fe.stdout | trim }}"
