---
- name: Credential id, {{ aap_cred_name }}
  ansible.builtin.uri:
    url: "{{ aap_api }}/credentials/?name={{ aap_cred_name | urlencode }}"
  register: aap_cred

- name: Already attached?
  ansible.builtin.uri:
    url: "{{ aap_api }}/job_templates/{{ aap_jt_r.json.id }}/credentials/?name={{ aap_cred_name | urlencode }}"
  register: aap_cred_on

- name: Attach {{ aap_cred_name }}
  ansible.builtin.uri:
    url: "{{ aap_api }}/job_templates/{{ aap_jt_r.json.id }}/credentials/"
    method: POST
    body: {id: "{{ aap_cred.json.results[0].id }}"}
  when:
    - aap_cred.json.count > 0
    - aap_cred_on.json.count == 0
  changed_when: true
