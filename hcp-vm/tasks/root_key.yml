---
# Make sure the HCP root key file loads, and get its public half.
# A key pasted into an AAP credential field can lose its line breaks; OpenSSH then rejects
# the injected file ("invalid format"). If so, rebuild it (BEGIN line, base64 body wrapped
# at 70, END line) next to the injected file, in the job's private directory.
# The usable path is hcp_key_path: hcp_root_key_file can come in as an extra var (AAP
# credential), which no set_fact can override.
- name: Key path to use
  ansible.builtin.set_fact:
    hcp_key_path: "{{ hcp_root_key_file }}"

- name: Root key loads?
  ansible.builtin.command: ssh-keygen -y -f {{ hcp_key_path }}
  delegate_to: localhost
  become: false
  register: hcp_root_pub
  changed_when: false
  failed_when: false

- name: Rebuild the key's line breaks
  when: hcp_root_pub.rc != 0
  delegate_to: localhost
  become: false
  block:
    - name: Normalise the key text
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import re, sys, textwrap
            k = sys.stdin.read().replace('\r', '').strip()
            m = re.match(r'-----BEGIN ([A-Z0-9 ]+)-----\s*(.*?)\s*-----END \1-----$', k, re.S)
            if not m:
                sys.exit('not a PEM/OpenSSH private key: paste the whole file, BEGIN and END lines included')
            body = re.sub(r'\s+', '', m.group(2))
            print('-----BEGIN %s-----\n%s\n-----END %s-----' % (m.group(1), '\n'.join(textwrap.wrap(body, 70)), m.group(1)))
        stdin: "{{ lookup('ansible.builtin.file', hcp_root_key_file) }}"
      register: hcp_key_fixed
      changed_when: false
      failed_when: false
      no_log: true

    - name: Credential holds a private key
      ansible.builtin.assert:
        that: hcp_key_fixed.rc == 0
        fail_msg: >-
          The HCP root key from the credential is not a PEM/OpenSSH private key. Paste the whole
          key file into the "HCP VM secrets" credential, BEGIN and END lines included.

    - name: Write the rebuilt key
      ansible.builtin.copy:
        content: "{{ hcp_key_fixed.stdout }}\n"
        dest: "{{ hcp_root_key_file }}.fixed"
        mode: "0600"
      no_log: true

    - name: Use the rebuilt key
      ansible.builtin.set_fact:
        hcp_key_path: "{{ hcp_root_key_file }}.fixed"

    - name: Rebuilt key loads?
      ansible.builtin.command: ssh-keygen -y -f {{ hcp_key_path }}
      register: hcp_root_pub_fixed
      changed_when: false

# Separate names: a skipped task would overwrite a registered result it shares.
- name: Root key public half
  ansible.builtin.set_fact:
    hcp_root_pubkey: "{{ hcp_root_pub.stdout if hcp_root_pub.rc == 0 else hcp_root_pub_fixed.stdout }}"
