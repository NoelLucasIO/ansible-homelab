# Default gitleaks rules, plus a guard against private addressing creeping back in.
[extend]
useDefault = true

[[rules]]
id = "private-ipv4"
description = "RFC 1918 address (use 192.0.2.x documentation addresses; real values belong in the inventory)"
regex = '''\b(10\.\d{1,3}|172\.(1[6-9]|2\d|3[01])|192\.168)\.\d{1,3}\.\d{1,3}\b'''

# HCP software build numbers (e.g. 10.1.1.14) have the same shape as a 10.x address.
[[rules.allowlists]]
description = "HCP build number, not an address"
regexTarget = "match"
regexes = ['''^10\.1\.1\.14$''']
