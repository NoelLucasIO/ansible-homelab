---
# Sockets shared by a server and its clients (gvmd + gsad + gvm-tools, redis + ospd).
# gvmd's lives in a host directory: as a named volume shared with gsad it kept
# reverting to root:root, and gvmd failed with "Could not write PID file at
# /run/gvmd/gvmd.pid". Bind mounts are never chowned or copied up by Podman.
- name: Uid of gvmd in its image
  ansible.builtin.command: >-
    podman run --rm --network none --entrypoint id {{ vigil_gb_registry }}/gvmd:stable -u gvmd
  register: vigil_gvmd_uid
  changed_when: false

- name: Recreate gvmd's run directory at boot
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/vigil.conf
    mode: "0644"
    content: |
      # {{ ansible_managed }}
      d {{ vigil_gvmd_run_dir }} 0755 {{ vigil_gvmd_uid.stdout_lines | last }} {{ vigil_gvmd_uid.stdout_lines | last }} -
  register: vigil_tmpfiles

- name: Create it now
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/vigil.conf
  changed_when: vigil_tmpfiles is changed

# The redis socket stays a named volume (it works); make sure the server owns it.
- name: Uid that serves each socket volume
  ansible.builtin.command: >-
    podman run --rm --network none --entrypoint id {{ item.image }} -u {{ item.user }}
  loop: "{{ vigil_socket_volumes }}"
  loop_control: { label: "{{ item.volume }}" }
  register: vigil_sock_uid
  changed_when: false

- name: Socket volumes exist
  ansible.builtin.shell: |
    podman volume exists {{ item.volume }} || podman volume create {{ item.volume }} >/dev/null
    podman volume inspect --format '{{ "{{" }}.Mountpoint{{ "}}" }}' {{ item.volume }}
  loop: "{{ vigil_socket_volumes }}"
  loop_control: { label: "{{ item.volume }}" }
  register: vigil_sock_path
  changed_when: false

- name: Socket volumes owned by their server
  ansible.builtin.file:
    path: "{{ item.0.stdout_lines | last }}"
    state: directory
    owner: "{{ item.1.stdout_lines | last }}"
    group: "{{ item.1.stdout_lines | last }}"
    mode: "0755"
  loop: "{{ vigil_sock_path.results | zip(vigil_sock_uid.results) | list }}"
  loop_control: { label: "{{ item.0.item.volume }} -> uid {{ item.1.stdout_lines | last }}" }
  register: vigil_sock_owner

- name: Restart servers whose socket volume had the wrong owner
  ansible.builtin.command: systemctl try-restart {{ item.item.0.item.unit }}.service
  loop: "{{ vigil_sock_owner.results | selectattr('changed') | list }}"
  loop_control: { label: "{{ item.item.0.item.unit }}" }
  when: vigil_pod_state.stdout == 'active'
  changed_when: true
  tags: [skip_ansible_lint]   # try-restart: only if already running
