---
# Brings AAP in line with backup/ (controller API, built-in modules only). Idempotent.
#   * credential type "PBS secrets" and credential "homelab-pbs" (filled from your vault when
#     pbs_root_password is there; optional fields are injected only when set)
#   * group "pbs_clients" in the inventory, with aap_pbs_clients as members
#   * job templates "PBS deploy" and "Backup clients", with the machine, NIOS/NPM and PBS credentials
#   * job templates "Backup now", "Restore files" and "Restore VM" with surveys (machine credential
#     only: they use the token and key already on the host). Survey choices: aap_pbs_clients,
#     aap_pbs_hypervisors, aap_pbs_backup_ids, aap_pbs_archives, aap_pbs_vms (site-vars).
#
#   ansible-playbook playbooks/aap-setup.yml -e @../hcp-vm/aap.local.yml -e @../site-vars.yml \
#     -e @playbooks/group_vars/all/vault.yml --ask-vault-pass
- name: AAP setup for backup
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - backup_defaults
  vars:
    aap_api: "{{ aap_url }}/api/controller/v2"
    aap_project: ansible-homelab
    aap_inventory: homelab
    aap_machine_credential: homelab-ssh
    aap_nios_credential: ipam-vm secrets          # nios_api_password, npm_identity, npm_secret
    aap_pbs_credential: homelab-pbs
    aap_pbs_clients: [fedora.example.com]         # inventory host names
    aap_pbs_hypervisors: "{{ aap_pbs_clients[:1] }}"   # hosts with VM backups (Restore VM targets)
    aap_pbs_backup_ids: [fedora]                  # backup ids in PBS (short hostnames, as `hostname -s`)
    aap_pbs_archives: [etc, root, home]           # archive names across the clients
    aap_pbs_vms: []                               # backed-up domains
    aap_pbs_stores: "{{ [pbs_datastore] + ([pbs_offsite_store] if pbs_offsite_enabled | bool else []) }}"
    aap_templates:
      - name: PBS deploy
        playbook: backup/playbooks/pbs-deploy.yml
        description: Proxmox Backup Server VM (unattended from the ISO) and its configuration through the API
        credentials: ["{{ aap_machine_credential }}", "{{ aap_nios_credential }}", "{{ aap_pbs_credential }}"]
      - name: Backup clients
        playbook: backup/playbooks/clients.yml
        description: proxmox-backup-client, tokens, encryption key and nightly timers on the pbs_clients hosts
        credentials: ["{{ aap_machine_credential }}", "{{ aap_pbs_credential }}"]
      - name: Backup now
        playbook: backup/playbooks/backup-now.yml
        description: Run the backup jobs now on the chosen hosts (files, VMs, or both) and wait for them
        credentials: ["{{ aap_machine_credential }}"]
        survey:
          - {question_name: Hosts, variable: pbs_target, type: multiselect, required: true,
             choices: "{{ aap_pbs_clients }}", default: "{{ aap_pbs_clients[0] }}"}
          - {question_name: What, variable: pbs_backup_what, type: multiplechoice, required: true,
             choices: [both, files, vms], default: both}
          - {question_name: VMs (empty = all the host backs up), variable: pbs_backup_vms, type: multiselect,
             required: false, choices: "{{ aap_pbs_vms if aap_pbs_vms | length > 0 else ['-'] }}", default: ""}
      - name: Restore files
        playbook: backup/playbooks/restore-files.yml
        description: Restore files from a host backup (local PBS or B2) into a staging directory, or in place with confirmation
        credentials: ["{{ aap_machine_credential }}"]
        survey:
          - {question_name: Restore onto host, variable: pbs_target, type: multiplechoice, required: true,
             choices: "{{ aap_pbs_clients }}", default: "{{ aap_pbs_clients[0] }}"}
          - {question_name: Source, question_description: "store1 = local PBS, b2-offsite = Backblaze B2 (counts as egress)",
             variable: pbs_restore_source, type: multiplechoice, required: true, choices: "{{ aap_pbs_stores }}", default: "{{ aap_pbs_stores[0] }}"}
          - {question_name: Whose backup, question_description: Backup id (short hostname); empty = the target host's own,
             variable: pbs_restore_from, type: multiplechoice, required: false, choices: "{{ aap_pbs_backup_ids }}", default: ""}
          - {question_name: Snapshot, question_description: "latest, a UTC date (2026-11-22 = newest that day), or a time (2026-11-22T06:15:04Z)",
             variable: pbs_restore_snapshot, type: text, required: true, default: latest, min: 1, max: 40}
          - {question_name: Archive, variable: pbs_restore_archive, type: multiplechoice, required: true,
             choices: "{{ aap_pbs_archives }}", default: "{{ aap_pbs_archives[0] }}"}
          - {question_name: Paths (optional),
             question_description: "One per line, inside the archive (/nlucas/.bashrc) or full (/home/nlucas/.bashrc). Empty = whole archive.",
             variable: pbs_restore_paths, type: textarea, required: false, default: "", min: 0, max: 4096}
          - {question_name: Mode, question_description: staging = into /var/tmp/pbs-restore, live files untouched; in-place = over the live files,
             variable: pbs_restore_mode, type: multiplechoice, required: true, choices: [staging, in-place], default: staging}
          - {question_name: Confirm in-place, question_description: "In place only: type OVERWRITE <short host name>, e.g. OVERWRITE fedora",
             variable: pbs_restore_confirm, type: text, required: false, default: "", min: 0, max: 64}
      - name: Restore VM
        playbook: backup/playbooks/restore-vm.yml
        description: Restore a VM from PBS (local or B2) as a new domain beside the original, stopped, new name, no UUID/MAC carried over
        credentials: ["{{ aap_machine_credential }}"]
        survey:
          - {question_name: Hypervisor, variable: pbs_target, type: multiplechoice, required: true,
             choices: "{{ aap_pbs_hypervisors }}", default: "{{ aap_pbs_hypervisors[0] }}"}
          - {question_name: Source, question_description: "store1 = local PBS, b2-offsite = Backblaze B2 (counts as egress)",
             variable: pbs_restore_source, type: multiplechoice, required: true, choices: "{{ aap_pbs_stores }}", default: "{{ aap_pbs_stores[0] }}"}
          - {question_name: VM, variable: pbs_restore_domain, type: multiplechoice, required: true,
             choices: "{{ aap_pbs_vms if aap_pbs_vms | length > 0 else ['-'] }}", default: "{{ (aap_pbs_vms + ['-'])[0] }}"}
          - {question_name: Snapshot, question_description: "latest, a UTC date (newest that day), or a time (2026-11-23T16:15:08Z)",
             variable: pbs_restore_snapshot, type: text, required: true, default: latest, min: 1, max: 40}
          - {question_name: New name (optional), question_description: "Default <VM>-restored-<UTC time>",
             variable: pbs_restore_name, type: text, required: false, default: "", min: 0, max: 64}
          - {question_name: Until checkpoint (optional),
             question_description: "Point in time inside the monthly chain, e.g. virtnbdbackup.3; empty = the snapshot's newest",
             variable: pbs_restore_until, type: text, required: false, default: "", min: 0, max: 64}
  module_defaults:
    ansible.builtin.uri:
      headers: "{{ {'Authorization': 'Bearer ' ~ aap_token} if aap_token | default('') | length > 0 else omit }}"
      user: "{{ omit if aap_token | default('') | length > 0 else aap_user }}"
      password: "{{ omit if aap_token | default('') | length > 0 else aap_password }}"
      force_basic_auth: "{{ aap_token | default('') | length == 0 }}"
      validate_certs: "{{ aap_validate_certs | default(false) }}"
      body_format: json
      return_content: true
      status_code: [200, 201, 202, 204]
  tasks:
    - name: Settings given
      ansible.builtin.assert:
        that:
          - aap_url is defined
          - aap_token | default('') | length > 0 or (aap_user is defined and aap_password is defined)
        fail_msg: "Pass -e @../hcp-vm/aap.local.yml (aap_url, aap_token) -e @../site-vars.yml."
        quiet: true

    - name: Project
      ansible.builtin.uri:
        url: "{{ aap_api }}/projects/?name={{ aap_project | urlencode }}"
      register: ab_project

    - name: Sync the project (the templates need backup/ in it)
      ansible.builtin.uri:
        url: "{{ aap_api }}/projects/{{ ab_project.json.results[0].id }}/update/"
        method: POST
      register: ab_sync
      changed_when: true

    - name: Wait for the sync
      ansible.builtin.uri:
        url: "{{ aap_api }}/project_updates/{{ ab_sync.json.id }}/"
      register: ab_sync_job
      until: ab_sync_job.json.status in ['successful', 'failed', 'error', 'canceled']
      retries: 60
      delay: 5
      failed_when: ab_sync_job.json.status != 'successful'

    - name: Inventory
      ansible.builtin.uri:
        url: "{{ aap_api }}/inventories/?name={{ aap_inventory | urlencode }}"
      register: ab_inv

    - name: Ids
      ansible.builtin.set_fact:
        ab_org: "{{ ab_project.json.results[0].organization }}"
        ab_project_id: "{{ ab_project.json.results[0].id }}"
        ab_inv_id: "{{ ab_inv.json.results[0].id }}"

    # --- Credential type and credential -----------------------------------------------
    - name: Credential type exists? PBS secrets
      ansible.builtin.uri:
        url: "{{ aap_api }}/credential_types/?name={{ 'PBS secrets' | urlencode }}"
      register: ab_ct_q

    - name: Create credential type PBS secrets
      ansible.builtin.uri:
        url: "{{ aap_api }}/credential_types/"
        method: POST
        body:
          name: PBS secrets
          description: Proxmox Backup Server root password, client encryption key, offsite (B2) keys
          kind: cloud
          inputs:
            fields:
              - {id: pbs_root_password, label: PBS root password, type: string, secret: true}
              - {id: pbs_client_encryption_key, label: Client encryption key (JSON), type: string, secret: true, multiline: true}
              - {id: pbs_offsite_access_key, label: Offsite S3 access key (B2 keyID), type: string}
              - {id: pbs_offsite_secret_key, label: Offsite S3 secret key (B2 applicationKey), type: string, secret: true}
            required: [pbs_root_password]
          injectors:
            extra_vars:
              pbs_root_password: !unsafe "{{ pbs_root_password }}"
              pbs_client_encryption_key: !unsafe "{{ pbs_client_encryption_key | default('') }}"
              pbs_offsite_access_key: !unsafe "{{ pbs_offsite_access_key | default('') }}"
              pbs_offsite_secret_key: !unsafe "{{ pbs_offsite_secret_key | default('') }}"
      register: ab_ct_new
      when: ab_ct_q.json.count == 0
      changed_when: true

    - name: Credential exists? {{ aap_pbs_credential }}
      ansible.builtin.uri:
        url: "{{ aap_api }}/credentials/?name={{ aap_pbs_credential | urlencode }}"
      register: ab_cred_q

    - name: Create or update the credential from the vault, {{ aap_pbs_credential }}
      ansible.builtin.uri:
        url: "{{ aap_api }}/credentials/{{ (ab_cred_q.json.results[0].id ~ '/') if ab_cred_q.json.count else '' }}"
        method: "{{ 'PATCH' if ab_cred_q.json.count else 'POST' }}"
        body:
          name: "{{ aap_pbs_credential }}"
          credential_type: "{{ (ab_ct_new.json.id if ab_ct_q.json.count == 0 else ab_ct_q.json.results[0].id) | int }}"
          organization: "{{ ab_org | int }}"
          inputs: >-
            {{ {'pbs_root_password': pbs_root_password,
                'pbs_client_encryption_key': pbs_client_encryption_key | default(''),
                'pbs_offsite_access_key': pbs_offsite_access_key | default(''),
                'pbs_offsite_secret_key': pbs_offsite_secret_key | default('')} | dict2items
               | selectattr('value') | items2dict }}
      when: pbs_root_password | default('') | length > 0
      changed_when: true
      no_log: true

    # --- Group pbs_clients --------------------------------------------------------------
    - name: Group exists? pbs_clients
      ansible.builtin.uri:
        url: "{{ aap_api }}/inventories/{{ ab_inv_id }}/groups/?name=pbs_clients"
      register: ab_grp_q

    - name: Create group pbs_clients
      ansible.builtin.uri:
        url: "{{ aap_api }}/inventories/{{ ab_inv_id }}/groups/"
        method: POST
        body: {name: pbs_clients, description: Hosts that back up to Proxmox Backup Server (backup/clients.yml)}
      register: ab_grp_new
      when: ab_grp_q.json.count == 0
      changed_when: true

    - name: Host ids
      ansible.builtin.uri:
        url: "{{ aap_api }}/inventories/{{ ab_inv_id }}/hosts/?name={{ item | urlencode }}"
      loop: "{{ aap_pbs_clients }}"
      register: ab_hosts

    - name: Hosts in pbs_clients
      ansible.builtin.uri:
        url: "{{ aap_api }}/groups/{{ ab_grp_new.json.id if ab_grp_q.json.count == 0 else ab_grp_q.json.results[0].id }}/hosts/"
        method: POST
        body: {id: "{{ item.json.results[0].id }}"}
      loop: "{{ ab_hosts.results | selectattr('json.count', 'gt', 0) | list }}"
      loop_control: { label: "{{ item.item }}" }
      changed_when: false

    - name: Not in the inventory (skipped)
      ansible.builtin.debug:
        msg: "{{ ab_hosts.results | selectattr('json.count', 'eq', 0) | map(attribute='item') | list }}"
      when: ab_hosts.results | selectattr('json.count', 'eq', 0) | list | length > 0

    # --- Job templates ---------------------------------------------------------------------
    - name: Job templates
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/aap_template.yml"
      loop: "{{ aap_templates }}"
      loop_control: { loop_var: ab_t, label: "{{ ab_t.name }}" }
