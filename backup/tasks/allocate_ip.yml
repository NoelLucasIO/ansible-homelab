---
# PBS address, recorded in NIOS as a host record (A + PTR in one object).
#   * existing host record for the name -> reuse it (reruns are safe)
#   * survey gave an address -> record that one
#   * otherwise -> next free address in pbs_network that doesn't answer ping
- name: Static address, no NIOS
  ansible.builtin.set_fact:
    pbs_addr: "{{ pbs_ip }}"
  when: not pbs_use_nios | bool

- name: NIOS IPAM
  when: pbs_use_nios | bool
  block:
    - name: Look up in NIOS, {{ pbs_fqdn }}
      ansible.builtin.uri:
        url: "{{ nios_wapi }}/record:host?name={{ pbs_fqdn }}&view={{ pbs_nios_view }}&_return_fields=name,ipv4addrs,comment"
      register: pbs_existing

    - name: Existing record must match a survey address
      ansible.builtin.assert:
        that: pbs_ip | length == 0 or pbs_existing.json[0].ipv4addrs[0].ipv4addr == pbs_ip
        fail_msg: >-
          NIOS already has {{ pbs_fqdn }} at {{ pbs_existing.json[0].ipv4addrs[0].ipv4addr }}, not {{ pbs_ip }}.
          Remove that record first, or leave the IP blank.
      when: pbs_existing.json | length > 0

    - name: Reuse its address
      ansible.builtin.set_fact:
        pbs_addr: "{{ pbs_existing.json[0].ipv4addrs[0].ipv4addr }}"
      when: pbs_existing.json | length > 0

    - name: Choose and record an address
      when: pbs_existing.json | length == 0
      block:
        - name: Survey address must be free in NIOS
          ansible.builtin.uri:
            url: "{{ nios_wapi }}/ipv4address?ip_address={{ pbs_ip }}&_return_fields=status,names"
          register: pbs_ipam_state
          when: pbs_ip | length > 0

        - name: Survey address is unused
          ansible.builtin.assert:
            that: pbs_ipam_state.json | length == 0 or pbs_ipam_state.json[0].status == 'UNUSED'
            fail_msg: "{{ pbs_ip }} is already used in NIOS by {{ pbs_ipam_state.json[0].names | default([]) }}."
          when: pbs_ip | length > 0

        - name: Find the network
          ansible.builtin.uri:
            url: "{{ nios_wapi }}/network?network={{ pbs_network }}"
          register: pbs_net
          when: pbs_ip | length == 0

        - name: Ask NIOS for free addresses
          ansible.builtin.uri:
            url: "{{ nios_wapi }}/{{ pbs_net.json[0]._ref }}?_function=next_available_ip"
            method: POST
            body: '{"num": {{ pbs_nios_candidates | int }}}'
          register: pbs_free
          when: pbs_ip | length == 0

        - name: Ping the candidates (catches devices NIOS doesn't know)
          ansible.builtin.command: ping -c 2 -W 1 {{ item }}
          loop: "{{ [pbs_ip] if pbs_ip | length > 0 else pbs_free.json.ips }}"
          register: pbs_ping
          changed_when: false
          failed_when: false

        # ping exit 1 = no reply. 0 (answers) and 2 (ping error, e.g. none in the execution

        # environment) both rule an address out, so a broken ping fails below instead of passing.

        - name: Pick the first silent one
          ansible.builtin.set_fact:
            pbs_addr: "{{ (pbs_ping.results | selectattr('rc', 'equalto', 1) | map(attribute='item') | list | first) | default('') }}"

        - name: Need a free address
          ansible.builtin.assert:
            that: pbs_addr | length > 0
            fail_msg: >-
              {{ 'The survey address ' ~ pbs_ip ~ ' answers ping, or ping failed.' if pbs_ip | length > 0
                 else 'All ' ~ pbs_nios_candidates ~ ' addresses NIOS offered answer ping, or ping failed (exit 2: is ping in the execution environment?).' }}

        - name: Host record (A + PTR)
          ansible.builtin.uri:
            url: "{{ nios_wapi }}/record:host"
            method: POST
            status_code: [201]
            body:
              name: "{{ pbs_fqdn }}"
              view: "{{ pbs_nios_view }}"
              configure_for_dns: true
              comment: "{{ pbs_owner_comment }}"
              ipv4addrs: [{ipv4addr: "{{ pbs_addr }}"}]
          changed_when: true

- name: PBS address
  ansible.builtin.debug:
    msg: "{{ pbs_fqdn }} -> {{ pbs_addr }}/{{ pbs_prefix }}, gw {{ pbs_gateway }}, DNS {{ pbs_dns }}"
