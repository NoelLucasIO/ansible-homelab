---
# Brings AAP in line with the pki project (controller API, built-in modules only). Idempotent.
#   * credential types "PKI secrets" and "PKI root CA", and the credentials homelab-pki /
#     homelab-pki-root from the vault values when present
#   * job templates "PKI deploy", "PKI trust" and "PKI remove"
#
#   ansible-playbook playbooks/aap-setup.yml -e @../hcp-vm/aap.local.yml -e @$HOME/pki-ceremony/pki-secrets.yml
#   (aap.local.yml, git-ignored: aap_url and aap_token, or aap_user + aap_password; add
#    --ask-vault-pass if it or a vault.yml is encrypted)
# The root key is read from ~/pki-ceremony/root_ca.key.enc.pem (ceremony.yml output) unless
# pki_root_key_pem is already set; its passphrase is prompted for (Enter skips that credential).
- name: AAP setup for pki
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - pki_defaults
  vars_prompt:
    - name: pki_root_key_passphrase
      prompt: "Root key passphrase from the ceremony (Enter to skip the 'PKI root CA' credential)"
      private: true
      default: ""
  vars:
    pki_root_key_file: "{{ lookup('env', 'HOME') }}/pki-ceremony/root_ca.key.enc.pem"
    aap_optional_credentials: [homelab-pki-root]   # attached when it exists, skipped otherwise
    aap_api: "{{ aap_url }}/api/controller/v2"
    aap_project: ansible-homelab
    aap_inventory: homelab
    aap_machine_credential: homelab-ssh
    aap_secrets_credential: homelab-secrets      # nios_api_password, npm_identity, npm_secret
    aap_ee: ""                                   # execution environment name; blank = default
    # Literal AAP injector templates (!unsafe: not rendered by Ansible here).
    aap_pki_types:
      - name: PKI secrets
        credential: homelab-pki
        description: step-ca passwords (intermediate key, admin provisioner, database)
        fields:
          - {id: pki_intermediate_password, label: Intermediate key password, type: string, secret: true}
          - {id: pki_admin_password, label: Admin provisioner password, type: string, secret: true}
          - {id: pki_db_password, label: Database password, type: string, secret: true}
        injectors:
          pki_intermediate_password: !unsafe "{{ pki_intermediate_password }}"
          pki_admin_password: !unsafe "{{ pki_admin_password }}"
          pki_db_password: !unsafe "{{ pki_db_password }}"
      - name: PKI root CA
        credential: homelab-pki-root
        description: Encrypted root CA key from ceremony.yml; signs the intermediate
        fields:
          - {id: pki_root_key_pem, label: Encrypted root key (root_ca.key.enc.pem), type: string, secret: true, multiline: true}
          - {id: pki_root_key_passphrase, label: Root key passphrase, type: string, secret: true}
        injectors:
          pki_root_key_pem: !unsafe "{{ pki_root_key_pem }}"
          pki_root_key_passphrase: !unsafe "{{ pki_root_key_passphrase }}"
  module_defaults:
    ansible.builtin.uri:
      headers: "{{ {'Authorization': 'Bearer ' ~ aap_token} if aap_token | default('') | length > 0 else omit }}"
      user: "{{ omit if aap_token | default('') | length > 0 else aap_user }}"
      password: "{{ omit if aap_token | default('') | length > 0 else aap_password }}"
      force_basic_auth: "{{ aap_token | default('') | length == 0 }}"
      validate_certs: "{{ aap_validate_certs | default(false) }}"
      body_format: json
      return_content: true
      status_code: [200, 201, 202, 204]
  tasks:
    - name: AAP connection settings given
      ansible.builtin.assert:
        that:
          - aap_url is defined
          - aap_token | default('') | length > 0 or (aap_user is defined and aap_password is defined)
        fail_msg: "Pass -e @../hcp-vm/aap.local.yml (aap_url + aap_token) or aap_user/aap_password."
        quiet: true

    - name: Project and inventory ids
      ansible.builtin.uri:
        url: "{{ aap_api }}/{{ item.kind }}/?name={{ item.name | urlencode }}"
      loop:
        - {kind: projects, name: "{{ aap_project }}"}
        - {kind: inventories, name: "{{ aap_inventory }}"}
      register: aap_ids

    - name: Both found
      ansible.builtin.assert:
        that: aap_ids.results | map(attribute='json.count') | min > 0
        fail_msg: "Project '{{ aap_project }}' or inventory '{{ aap_inventory }}' not found in AAP."
        quiet: true

    - name: Sync the project
      ansible.builtin.uri:
        url: "{{ aap_api }}/projects/{{ aap_ids.results[0].json.results[0].id }}/update/"
        method: POST
      register: aap_sync
      changed_when: true

    - name: Wait for the sync
      ansible.builtin.uri:
        url: "{{ aap_api }}/project_updates/{{ aap_sync.json.id }}/"
      register: aap_sync_job
      until: aap_sync_job.json.status in ['successful', 'failed', 'error', 'canceled']
      retries: 60
      delay: 5

    - name: Sync succeeded
      ansible.builtin.assert:
        that: aap_sync_job.json.status == 'successful'
        fail_msg: "Project sync {{ aap_sync_job.json.status }}; see project update {{ aap_sync.json.id }} in AAP."
        quiet: true

    - name: Execution environment id
      ansible.builtin.uri:
        url: "{{ aap_api }}/execution_environments/?name={{ aap_ee | urlencode }}"
      register: aap_ee_q
      when: aap_ee | length > 0

    - name: Secrets credential (for its organization)
      ansible.builtin.uri:
        url: "{{ aap_api }}/credentials/?name={{ aap_secrets_credential | urlencode }}"
      register: aap_sec

    - name: Secrets credential found
      ansible.builtin.assert:
        that: aap_sec.json.count == 1
        fail_msg: "Credential '{{ aap_secrets_credential }}' not found; pass -e aap_secrets_credential=<name>."
        quiet: true

    - name: Root key from the ceremony output (when not given in a vault)
      ansible.builtin.set_fact:
        pki_root_key_pem: "{{ lookup('ansible.builtin.file', pki_root_key_file) }}"
      when:
        - pki_root_key_pem | default('') | length == 0
        - pki_root_key_passphrase | length > 0
        - pki_root_key_file is file
      no_log: true

    - name: PKI credential types and credentials
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/aap_credential.yml"
      loop: "{{ aap_pki_types }}"
      loop_control:
        loop_var: aap_ct
        label: "{{ aap_ct.name }}"

    - name: Create or update the job templates
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/aap_job_template.yml"
      loop:
        - name: PKI deploy
          playbook: pki/playbooks/deploy.yml
          description: Lab CA (step-ca) rootless pod on fedora; renews the intermediate when due
          timeout: 1800
          extra_credentials: [homelab-pki, homelab-pki-root]
          survey: "{{ lookup('ansible.builtin.template', playbook_dir ~ '/../templates/aap/survey-deploy.yml.j2') | from_yaml }}"
        - name: PKI trust
          playbook: pki/playbooks/trust.yml
          description: Add (or remove) the lab root CA in the OS trust store of existing hosts
          timeout: 900
          survey: "{{ lookup('ansible.builtin.template', playbook_dir ~ '/../templates/aap/survey-trust.yml.j2') | from_yaml }}"
        - name: PKI remove
          playbook: pki/playbooks/remove.yml
          description: Stop and remove the lab CA pod (keeps keys, certificates and database)
          timeout: 600
          survey: "{{ lookup('ansible.builtin.template', playbook_dir ~ '/../templates/aap/survey-remove.yml.j2') | from_yaml }}"
      loop_control:
        loop_var: aap_jt
        label: "{{ aap_jt.name }}"
