---
- name: Credential id, {{ aap_cred_name }}
  ansible.builtin.uri:
    url: "{{ aap_api }}/credentials/?name={{ aap_cred_name | urlencode }}"
  register: aap_cred

- name: Credentials that do exist (shown only when the name is wrong)
  ansible.builtin.uri:
    url: "{{ aap_api }}/credentials/?page_size=200&order_by=name"
  register: aap_cred_all
  when: aap_cred.json.count == 0

- name: Credential exists, {{ aap_cred_name }}
  ansible.builtin.assert:
    that: aap_cred.json.count > 0 or aap_cred_name in aap_optional_credentials | default([])
    fail_msg: >-
      No AAP credential named '{{ aap_cred_name }}'. Existing:
      {{ aap_cred_all.json.results | default([]) | map(attribute='name') | join(' | ') }}

- name: Optional credential not there yet, skipped
  ansible.builtin.debug:
    msg: "'{{ aap_cred_name }}' doesn't exist yet; rerun aap-setup.yml once it does to attach it."
  when: aap_cred.json.count == 0

- name: Already attached?
  ansible.builtin.uri:
    url: "{{ aap_api }}/job_templates/{{ aap_jt_r.json.id }}/credentials/?name={{ aap_cred_name | urlencode }}"
  register: aap_cred_on
  when: aap_cred.json.count > 0

- name: Attach {{ aap_cred_name }}
  ansible.builtin.uri:
    url: "{{ aap_api }}/job_templates/{{ aap_jt_r.json.id }}/credentials/"
    method: POST
    body: {id: "{{ aap_cred.json.results[0].id }}"}
  when: aap_cred.json.count > 0 and aap_cred_on.json.count == 0
  changed_when: true
