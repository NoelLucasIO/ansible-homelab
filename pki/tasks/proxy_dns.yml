---
# https://pki.<domain>: landing page, wildcard certificate, LAN-only.
# http://ca.<domain>:   CRL and AIA (plain HTTP on purpose: relying parties fetch them before
#                       they can trust anything), LAN-only. ACME/API go straight to step-ca
#                       on :{{ pki_ca_port }} with its own certificate, so ca.<domain> points here.
- name: NPM proxy hosts
  ansible.builtin.include_tasks: npm_login.yml

- name: Certificates and access lists
  ansible.builtin.uri:
    url: "{{ npm_api }}/nginx/{{ item }}"
    headers: "{{ npm_headers }}"
    return_content: true
  loop: [certificates, access-lists]
  register: npm_lookup

- name: Pick the wildcard certificate (newest) and the LAN-only list
  ansible.builtin.set_fact:
    npm_cert_id: "{{ (npm_lookup.results[0].json | selectattr('domain_names', 'contains', npm_cert_domain)
                      | sort(attribute='expires_on') | last).id }}"
    npm_acl_id: "{{ (npm_lookup.results[1].json | selectattr('name', 'equalto', npm_access_list_name) | first).id }}"

- name: Proxy host -> http://127.0.0.1:{{ pki_web_port }}
  ansible.builtin.uri:
    url: "{{ npm_api }}/nginx/proxy-hosts"
    method: POST
    headers: "{{ npm_headers }}"
    body_format: json
    status_code: [200, 201]
    body:
      domain_names: ["{{ item.fqdn }}"]
      forward_scheme: http
      forward_host: 127.0.0.1                # NPM runs with Network=host
      forward_port: "{{ pki_web_port | int }}"
      certificate_id: "{{ (npm_cert_id | int) if item.tls else 0 }}"
      access_list_id: "{{ npm_acl_id | int }}"
      ssl_forced: "{{ item.tls }}"
      http2_support: "{{ item.tls }}"
      block_exploits: true
      allow_websocket_upgrade: false
      caching_enabled: false
      hsts_enabled: false
      hsts_subdomains: false
      advanced_config: ""
      locations: []
      meta: { letsencrypt_agree: false, dns_challenge: false }
  changed_when: true
  loop:
    - { fqdn: "{{ pki_web_fqdn }}", tls: true }
    - { fqdn: "{{ pki_ca_fqdn }}", tls: false }
  loop_control: { label: "{{ item.fqdn }} ({{ 'https' if item.tls else 'http' }})" }
  when: npm_hosts.json | selectattr('domain_names', 'contains', item.fqdn) | list | length == 0

- name: NIOS A records
  module_defaults:
    ansible.builtin.uri:
      user: "{{ nios_api_user }}"
      password: "{{ nios_api_password }}"
      force_basic_auth: true
      validate_certs: false
      body_format: json
      return_content: true
      status_code: [200, 201]
      timeout: 60
  block:
    - name: Existing records
      ansible.builtin.uri:
        url: "{{ nios_wapi }}/record:a?name={{ item }}"
      loop: ["{{ pki_web_fqdn }}", "{{ pki_ca_fqdn }}"]
      register: pki_a

    - name: A record -> {{ pki_ca_ip }}
      ansible.builtin.uri:
        url: "{{ nios_wapi }}/record:a"
        method: POST
        status_code: [201]
        body:
          name: "{{ item.item }}"
          ipv4addr: "{{ pki_ca_ip }}"
          view: default
          comment: "{{ pki_record_comment }}"
      changed_when: true
      loop: "{{ pki_a.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: item.json | length == 0

    - name: Existing records point elsewhere
      ansible.builtin.assert:
        that: item.json | length == 0 or (item.json | map(attribute='ipv4addr') | list) == [pki_ca_ip]
        fail_msg: "{{ item.item }} already exists in NIOS with {{ item.json | map(attribute='ipv4addr') | list }}; expected {{ pki_ca_ip }}."
        quiet: true
      loop: "{{ pki_a.results }}"
      loop_control: { label: "{{ item.item }}" }

- name: Names resolve on NIOS (authoritative)
  ansible.builtin.command: dig @{{ nios_ip }} +short {{ item }}
  loop: ["{{ pki_web_fqdn }}", "{{ pki_ca_fqdn }}"]
  register: pki_dig_nios
  changed_when: false
  until: pki_ca_ip in pki_dig_nios.stdout
  retries: 10
  delay: 6

# A caching resolver keeps an earlier NXDOMAIN until its negative TTL runs out: warn, don't fail.
- name: Names resolve through the client resolver
  ansible.builtin.command: dig @{{ pki_dns_resolver }} +short {{ item }}
  loop: ["{{ pki_web_fqdn }}", "{{ pki_ca_fqdn }}"]
  register: pki_dig
  changed_when: false

- name: Resolver still has a cached negative answer
  ansible.builtin.debug:
    msg: >-
      {{ item.item }} resolves on NIOS but not yet through {{ pki_dns_resolver }} (cached NXDOMAIN).
      It clears when the negative TTL expires (Unbound: unbound-control flush_negative).
  loop: "{{ pki_dig.results }}"
  loop_control: { label: "{{ item.item }}" }
  when: pki_ca_ip not in item.stdout
