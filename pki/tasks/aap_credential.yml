---
# One credential type (created if missing; AAP won't change the fields of a type in use)
# and its credential, filled from the vault when every field has a value there.
- name: Vault values (blank when not there), {{ aap_ct.credential }}
  ansible.builtin.set_fact:
    aap_ct_ids: "{{ aap_ct.fields | map(attribute='id') | list }}"
    aap_ct_vals: "{{ query('ansible.builtin.vars', *(aap_ct.fields | map(attribute='id') | list), default='') }}"
  no_log: true

- name: Credential type exists? {{ aap_ct.name }}
  ansible.builtin.uri:
    url: "{{ aap_api }}/credential_types/?name={{ aap_ct.name | urlencode }}"
  register: aap_ct_q

- name: Create credential type {{ aap_ct.name }}
  ansible.builtin.uri:
    url: "{{ aap_api }}/credential_types/"
    method: POST
    body:
      name: "{{ aap_ct.name }}"
      description: "{{ aap_ct.description }}"
      kind: cloud
      inputs:
        fields: "{{ aap_ct.fields }}"
        required: "{{ aap_ct.fields | map(attribute='id') | list }}"
      injectors:
        extra_vars: "{{ aap_ct.injectors }}"
  register: aap_ct_new
  when: aap_ct_q.json.count == 0
  changed_when: true

- name: Credential {{ aap_ct.credential }}
  when: aap_ct_vals | select | list | length == aap_ct_ids | length
  vars:
    aap_ct_id: "{{ aap_ct_new.json.id if aap_ct_q.json.count == 0 else aap_ct_q.json.results[0].id }}"
  block:
    - name: Does it exist? {{ aap_ct.credential }}
      ansible.builtin.uri:
        url: "{{ aap_api }}/credentials/?name={{ aap_ct.credential | urlencode }}"
      register: aap_cred_q

    - name: Create or update {{ aap_ct.credential }}
      ansible.builtin.uri:
        url: "{{ aap_api }}/credentials/{{ (aap_cred_q.json.results[0].id ~ '/') if aap_cred_q.json.count else '' }}"
        method: "{{ 'PATCH' if aap_cred_q.json.count else 'POST' }}"
        body:
          name: "{{ aap_ct.credential }}"
          credential_type: "{{ aap_ct_id | int }}"
          organization: "{{ aap_sec.json.results[0].organization }}"
          inputs: "{{ dict(aap_ct_ids | zip(aap_ct_vals)) }}"
      no_log: true
      changed_when: true

- name: Not in the vault, so not created
  ansible.builtin.debug:
    msg: >-
      Credential '{{ aap_ct.credential }}' ({{ aap_ct.name }}) skipped: put
      {{ aap_ct_ids | join(', ') }} in the vault and rerun, or create it in the AAP UI.
  when: aap_ct_vals | select | list | length != aap_ct_ids | length
