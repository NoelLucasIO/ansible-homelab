---
# Validate the survey, derive names, and check the hypervisor has what it needs.
- name: Check inputs
  ansible.builtin.assert:
    that:
      - vtm_name is match('^[a-z][a-z0-9-]{0,62}$')
      - vtm_ip | length == 0 or vtm_ip is match('^(\d{1,3}\.){3}\d{1,3}$')
      - vtm_ip | length > 0 or vtm_use_nios | bool
      - vtm_prefix | int >= 8
      - vtm_prefix | int <= 30
      - vtm_vcpus | int >= 1
      - vtm_memory_gb | int >= 2
      - vtm_disk_gb | int >= 20
      - vtm_nic_count | int >= 1
      - vtm_nic_count | int <= 8
      - vtm_admin_password is defined
      - vtm_admin_password | length >= 8
      - vtm_admin_password is not search('[\r\n]')
    fail_msg: >-
      Check the survey: lowercase name; IP blank (NIOS) or IPv4, and an IP is required when NIOS is off;
      at least 1 vCPU / 2 GB / 20 GB / 1 NIC (max 8); admin password of 8+ characters.
  no_log: true    # the expression list includes the password

- name: Size of /logs after the resize (GiB)
  ansible.builtin.debug:
    msg: "/logs will be ~{{ '%.1f' | format(vtm_disk_gb | int - 9.3) }} GiB (minimum 8)"

- name: Derive names, mask, MACs (52:54:00 = QEMU/KVM prefix)
  ansible.builtin.set_fact:
    vtm_fqdn: "{{ vtm_name }}.{{ vtm_domain }}"
    vtm_admin_fqdn: "{{ vtm_name }}{{ vtm_admin_suffix }}.{{ vtm_domain }}"
    vtm_disk: "{{ vtm_disk_dir }}/{{ vtm_name }}-root.qcow2"
    vtm_dns_list: "{{ (vtm_dns if vtm_dns is not string else vtm_dns | regex_replace(',', ' ') | split) | list }}"
    vtm_mask: >-
      {%- set p = vtm_prefix | int -%}
      {%- for i in range(4) -%}
      {{ 256 - 2 ** (8 - ([0, [8, p - 8 * i] | min] | max)) }}{{ '.' if not loop.last else '' }}{%- endfor -%}
    vtm_macs: >-
      {{ range(vtm_nic_count | int) | map('string') | map('regex_replace', '^', vtm_name ~ '-nic') | map('hash', 'md5')
         | map('regex_replace', '^(..)(..)(..).*$', '52:54:00:\1:\2:\3') | list }}

- name: Distribution of {{ inventory_hostname }}
  ansible.builtin.setup:
    gather_subset: ['!all', '!min', distribution]

- name: Tools on {{ inventory_hostname }}
  ansible.builtin.package:
    name: "{{ vtm_hypervisor_packages[ansible_facts.os_family] | default(vtm_hypervisor_packages.default) }}"
    state: present

- name: Tools present
  ansible.builtin.command: sh -c 'for t in virt-install virsh qemu-img virt-resize virt-filesystems guestfish unzip; do command -v $t || exit 1; done'
  register: vtm_tools
  changed_when: false
  failed_when: false

- name: Image zip present?
  ansible.builtin.stat:
    path: "{{ vtm_image_zip }}"
    get_checksum: false
  register: vtm_zip

- name: Hypervisor ready
  ansible.builtin.assert:
    that:
      - vtm_tools.rc == 0
      - vtm_zip.stat.exists
    fail_msg: >-
      {{ inventory_hostname }}: need {{ vtm_image_zip }} (copy the vTM KVM zip there or set vtm_image_zip
      in host_vars) and virt-install, virsh, qemu-img, virt-resize, virt-filesystems, guestfish, unzip on PATH.

- name: Licence file present on the hypervisor?
  ansible.builtin.stat:
    path: "{{ vtm_license_file }}"
    get_checksum: false
  register: vtm_lic
  when: vtm_license_file | length > 0

- name: Licence file found
  ansible.builtin.assert:
    that: vtm_lic.stat.exists
    fail_msg: "{{ vtm_license_file }} not found on {{ inventory_hostname }}. Leave it blank for developer mode."
  when: vtm_license_file | length > 0

- name: Does the domain exist?
  ansible.builtin.command: virsh domstate {{ vtm_name }}
  register: vtm_domstate
  changed_when: false
  failed_when: false

- name: Plan
  ansible.builtin.debug:
    msg: >-
      {{ vtm_name }} on {{ inventory_hostname }}: {{ vtm_vcpus }} vCPU, {{ vtm_memory_gb }} GB,
      {{ vtm_disk_gb }} GB disk, {{ vtm_nic_count }} NIC(s).
      Domain {{ 'exists (' ~ vtm_domstate.stdout ~ ')' if vtm_domstate.rc == 0 else 'is new' }};
      replace={{ vtm_replace | bool }}; licence={{ vtm_license_file or 'none (developer mode)' }}.
