---
# Management address, recorded in NIOS as a host record (A + PTR in one object).
#   * existing host record for the name -> reuse it (reruns are safe)
#   * survey gave an address -> record that one
#   * otherwise -> next free address in vtm_network that doesn't answer ping
- name: Static address, no NIOS
  ansible.builtin.set_fact:
    vtm_addr: "{{ vtm_ip }}"
  when: not vtm_use_nios | bool

- name: NIOS IPAM
  when: vtm_use_nios | bool
  block:
    - name: Look up in NIOS, {{ vtm_fqdn }}
      ansible.builtin.uri:
        url: "{{ nios_wapi }}/record:host?name={{ vtm_fqdn }}&view={{ vtm_nios_view }}&_return_fields=name,ipv4addrs,comment"
      register: vtm_existing

    - name: Existing record must match a survey address
      ansible.builtin.assert:
        that: vtm_ip | length == 0 or vtm_existing.json[0].ipv4addrs[0].ipv4addr == vtm_ip
        fail_msg: >-
          NIOS already has {{ vtm_fqdn }} at {{ vtm_existing.json[0].ipv4addrs[0].ipv4addr }}, not {{ vtm_ip }}.
          Run the destroy template first, or leave the IP blank.
      when: vtm_existing.json | length > 0

    - name: Reuse its address
      ansible.builtin.set_fact:
        vtm_addr: "{{ vtm_existing.json[0].ipv4addrs[0].ipv4addr }}"
      when: vtm_existing.json | length > 0

    - name: Choose and record an address
      when: vtm_existing.json | length == 0
      block:
        - name: Survey address must be free in NIOS
          ansible.builtin.uri:
            url: "{{ nios_wapi }}/ipv4address?ip_address={{ vtm_ip }}&_return_fields=status,names"
          register: vtm_ipam_state
          when: vtm_ip | length > 0

        - name: Survey address is unused
          ansible.builtin.assert:
            that: vtm_ipam_state.json | length == 0 or vtm_ipam_state.json[0].status == 'UNUSED'
            fail_msg: "{{ vtm_ip }} is already used in NIOS by {{ vtm_ipam_state.json[0].names | default([]) }}."
          when: vtm_ip | length > 0

        - name: Find the network
          ansible.builtin.uri:
            url: "{{ nios_wapi }}/network?network={{ vtm_network }}"
          register: vtm_net
          when: vtm_ip | length == 0

        - name: Ask NIOS for free addresses
          ansible.builtin.uri:
            url: "{{ nios_wapi }}/{{ vtm_net.json[0]._ref }}?_function=next_available_ip"
            method: POST
            body: '{"num": {{ vtm_nios_candidates | int }}}'
          register: vtm_free
          when: vtm_ip | length == 0

        - name: Ping the candidates (catches devices NIOS doesn't know)
          ansible.builtin.command: ping -c 2 -W 1 {{ item }}
          loop: "{{ [vtm_ip] if vtm_ip | length > 0 else vtm_free.json.ips }}"
          register: vtm_ping
          changed_when: false
          failed_when: false

        # ping exit 1 = no reply. 0 (answers) and 2 (ping error, e.g. none in the execution

        # environment) both rule an address out, so a broken ping fails below instead of passing.

        - name: Pick the first silent one
          ansible.builtin.set_fact:
            vtm_addr: "{{ (vtm_ping.results | selectattr('rc', 'equalto', 1) | map(attribute='item') | list | first) | default('') }}"

        - name: Need a free address
          ansible.builtin.assert:
            that: vtm_addr | length > 0
            fail_msg: >-
              {{ 'The survey address ' ~ vtm_ip ~ ' answers ping, or ping failed.' if vtm_ip | length > 0
                 else 'All ' ~ vtm_nios_candidates ~ ' addresses NIOS offered answer ping, or ping failed (exit 2: is ping in the execution environment?).' }}

        - name: Host record (A + PTR)
          ansible.builtin.uri:
            url: "{{ nios_wapi }}/record:host"
            method: POST
            status_code: [201]
            body:
              name: "{{ vtm_fqdn }}"
              view: "{{ vtm_nios_view }}"
              configure_for_dns: true
              comment: "{{ vtm_owner_comment }}"
              ipv4addrs: [{ipv4addr: "{{ vtm_addr }}"}]
          changed_when: true

- name: Management address
  ansible.builtin.debug:
    msg: "{{ vtm_fqdn }} -> {{ vtm_addr }}/{{ vtm_prefix }} ({{ vtm_mask }}), gw {{ vtm_gateway }}, DNS {{ vtm_dns_list | join(' ') }}"
