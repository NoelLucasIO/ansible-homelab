---
# Syncs the project, then creates/updates in AAP (controller API, built-in modules only):
#   * credential type "vTM API" (API user password, admin password, Splunk HEC token)
#   * job templates "vTM platform", "vTM backup" and "vTM certificate", with surveys
#   * a daily schedule for "vTM backup" and a weekly one for "vTM certificate" (when vtm_pki_host is set)
# Idempotent: rerun after changing site values to refresh survey defaults.
#
#   ansible-playbook vtm-config/playbooks/aap-setup.yml -e @site-vars.yml \
#     -e aap_url=https://aap.example.com -e aap_user=admin -e aap_password=... \
#     -e '{"aap_machine_credential": "homelab-ssh", "aap_secrets_credential": "vtm-api"}'
#
# First run creates the credential type; then create a credential of that type in AAP and
# rerun with aap_secrets_credential set so it gets attached.
- name: AAP job templates for vtm-config
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - vtm_config_defaults
  vars:
    aap_api: "{{ aap_url }}/api/controller/v2"
    aap_project: ansible-homelab
    aap_inventory: homelab
    aap_machine_credential: ""     # SSH: Alloy host, lab CA host, appliance (REST restart)
    aap_secrets_credential: ""     # a credential of type "vTM API"
    aap_ee: ""
    aap_backup_rrule: "DTSTART;TZID=America/New_York:20260101T024700 RRULE:FREQ=DAILY;INTERVAL=1"
    aap_cert_rrule: "DTSTART;TZID=America/New_York:20260101T033700 RRULE:FREQ=WEEKLY;INTERVAL=1;BYDAY=SU"
  module_defaults:
    ansible.builtin.uri:
      user: "{{ aap_user }}"
      password: "{{ aap_password }}"
      force_basic_auth: true
      validate_certs: "{{ aap_validate_certs | default(false) }}"
      body_format: json
      return_content: true
      status_code: [200, 201, 204]
  tasks:
    - name: Credential type exists?
      ansible.builtin.uri:
        url: "{{ aap_api }}/credential_types/?name={{ 'vTM API' | urlencode }}"
      register: aap_ct

    - name: Create or update the credential type
      ansible.builtin.uri:
        url: "{{ aap_api }}/credential_types/{{ (aap_ct.json.results[0].id ~ '/') if aap_ct.json.count else '' }}"
        method: "{{ 'PATCH' if aap_ct.json.count else 'POST' }}"
        body:
          name: vTM API
          kind: cloud
          description: Ivanti vTM API user password, admin password (to create that user), Splunk HEC token
          inputs:
            fields:
              - {id: vtm_api_password, label: API user password (12+), type: string, secret: true}
              - {id: vtm_admin_password, label: admin password (only needed to create the API user), type: string, secret: true}
              - {id: vtm_hec_token, label: Splunk HEC token (optional), type: string, secret: true}
            required: [vtm_api_password]
          injectors:
            extra_vars:
              vtm_api_password: "{% raw %}{{ vtm_api_password }}{% endraw %}"
              vtm_admin_password: "{% raw %}{{ vtm_admin_password | default('') }}{% endraw %}"
              vtm_hec_token: "{% raw %}{{ vtm_hec_token | default('') }}{% endraw %}"
      changed_when: true

    - name: Project and inventory ids
      ansible.builtin.uri:
        url: "{{ aap_api }}/{{ item.kind }}/?name={{ item.name | urlencode }}"
      loop:
        - {kind: projects, name: "{{ aap_project }}"}
        - {kind: inventories, name: "{{ aap_inventory }}"}
      register: aap_ids

    - name: Both found
      ansible.builtin.assert:
        that: aap_ids.results | map(attribute='json.count') | min > 0
        fail_msg: "Project '{{ aap_project }}' or inventory '{{ aap_inventory }}' not found in AAP."

    # Templates name playbooks; AAP rejects one its last project sync didn't see.
    - name: Sync the project
      ansible.builtin.uri:
        url: "{{ aap_api }}/projects/{{ aap_ids.results[0].json.results[0].id }}/update/"
        method: POST
        status_code: [200, 201, 202]
      register: aap_sync
      changed_when: true

    - name: Wait for the sync
      ansible.builtin.uri:
        url: "{{ aap_api }}/project_updates/{{ aap_sync.json.id }}/"
      register: aap_sync_job
      until: aap_sync_job.json.status in ['successful', 'failed', 'error', 'canceled']
      retries: 60
      delay: 5

    - name: Sync succeeded
      ansible.builtin.assert:
        that: aap_sync_job.json.status == 'successful'
        fail_msg: "Project sync {{ aap_sync_job.json.status }}; see project update {{ aap_sync.json.id }} in AAP."
        quiet: true

    - name: Execution environment id
      ansible.builtin.uri:
        url: "{{ aap_api }}/execution_environments/?name={{ aap_ee | urlencode }}"
      register: aap_ee_q
      when: aap_ee | length > 0

    - name: Create or update the job templates
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/aap_job_template.yml"
      loop:
        - name: vTM platform
          playbook: vtm-config/playbooks/platform.yml
          description: vTM API user, NTP, event syslog to Loki (+ Alloy listener), Analytics Export to Splunk HEC
          survey: "{{ lookup('ansible.builtin.template', playbook_dir ~ '/../templates/aap/survey-platform.yml.j2') | from_yaml }}"
        - name: vTM backup
          playbook: vtm-config/playbooks/backup.yml
          description: Full configuration backup on the vTM appliance, keeping the newest N
          survey: "{{ lookup('ansible.builtin.template', playbook_dir ~ '/../templates/aap/survey-backup.yml.j2') | from_yaml }}"
        - name: vTM certificate
          playbook: vtm-config/playbooks/certificate.yml
          description: Admin server certificate (UI, SOAP, REST) from the lab CA; renews when due
          survey: "{{ lookup('ansible.builtin.template', playbook_dir ~ '/../templates/aap/survey-certificate.yml.j2') | from_yaml }}"
      loop_control:
        loop_var: aap_jt
        label: "{{ aap_jt.name }}"

    - name: Daily backup schedule
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/aap_schedule.yml"
      vars:
        aap_sched_template: vTM backup
        aap_sched_name: "vTM backup daily ({{ vtm_target }})"
        aap_sched_rrule: "{{ aap_backup_rrule }}"
        aap_sched_extra: {vtm_target: "{{ vtm_target }}", vtm_backup_keep: "{{ vtm_backup_keep | int }}"}

    - name: Weekly certificate renewal schedule
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/aap_schedule.yml"
      when: vtm_pki_host | length > 0
      vars:
        aap_sched_template: vTM certificate
        aap_sched_name: "vTM certificate renewal ({{ vtm_target }})"
        aap_sched_rrule: "{{ aap_cert_rrule }}"
        aap_sched_extra:
          vtm_target: "{{ vtm_target }}"
          vtm_pki_host: "{{ vtm_pki_host }}"
          vtm_pki_issued_dir: "{{ vtm_pki_issued_dir }}"
          # AAP wants every required survey answer on a schedule.
          vtm_cert_days: "{{ vtm_cert_days | int }}"
          vtm_cert_renew_days: "{{ vtm_cert_renew_days | int }}"
          vtm_cert_key: "{{ vtm_cert_key }}"
          vtm_cert_ip_san: "{{ vtm_cert_ip_san | bool | string | lower }}"
          vtm_cert_force: "false"
          vtm_cert_restart_rest: "{{ vtm_cert_restart_rest | bool | string | lower }}"
          vtm_ssh_user: "{{ vtm_ssh_user }}"
