---
# Defaults only. Role defaults have the lowest precedence, so inventory variables
# (AAP inventory included), survey answers and -e all override them.
# Documentation addresses (RFC 5737) and example.com: real values live in the inventory.

# --- Which appliance -----------------------------------------------------------------
vtm_target: vtm01.example.com       # the appliance (or any member of a cluster); REST runs from the controller
vtm_rest_port: 9070
vtm_admin_port: 9090                # admin server: UI and SOAP; set to match System > Security (not in REST)
vtm_rest_api_version: "8.6"         # used if the appliance offers it, else its newest
vtm_validate_certs: false           # the appliance's own self-signed certificate until step 2 (certificates)

# --- Accounts ------------------------------------------------------------------------
# The playbooks log in as vtm_api_user. If that fails (first run, or a rebuilt appliance),
# they log in once as admin and create it, or reset its password, over the SOAP control API:
# REST 8.6 has no resource for local users.
vtm_api_user: ansible
vtm_admin_user: admin                # the account that may create users (admin group)
vtm_api_group: admin
# vtm_api_password: AAP credential / vault
# vtm_admin_password: AAP credential / vault; only needed when the API user has to be (re)made

# --- Ownership marker --------------------------------------------------------------------
vtm_owner_note: "vtm-config: managed by AAP"   # put on objects this project creates

# --- NTP -------------------------------------------------------------------------------
# The AAP survey passes vtm_ntp_servers_csv ("a,b"); otherwise the baseline's servers, else a placeholder.
vtm_ntp_servers: >-
  {{ vtm_ntp_servers_csv.split(',') | map('trim') | select | list if vtm_ntp_servers_csv is defined
     else baseline_ntp_servers | default(['192.0.2.1']) }}

# --- Event syslog -> Alloy -> Loki -----------------------------------------------------------
# vTM sends RFC 5424 over UDP only. Alloy (rootless) gets its own listener on vtm_syslog_port.
vtm_syslog_enabled: true
vtm_syslog_host: "{{ baseline_log_alloy | default('192.0.2.45') }}"
vtm_syslog_port: 1518
vtm_syslog_action: Syslog to Loki
vtm_syslog_event_type: All Events     # built-in event type the action is added to (its other actions are kept)

# vtm_alloy_host: inventory host running Alloy (e.g. fedora). Unset = no listener, no Loki check.
vtm_alloy_config_dir: /etc/alloy    # host path mounted into the Alloy container (every *.alloy is loaded)
vtm_alloy_owner: alloy              # user that owns the rootless Alloy service
vtm_alloy_unit: alloy.service
vtm_alloy_job: vtm                  # Loki label job=...
# Components of the existing Alloy config the listener plugs into (blank relabel = none).
vtm_alloy_relabel_rules: loki.relabel.syslog.rules
vtm_alloy_forward_to: loki.write.local.receiver
vtm_loki_url: http://127.0.0.1:3100 # queried from vtm_alloy_host to prove events arrive

# --- Analytics Export -> Splunk HEC --------------------------------------------------------
# Only configured when vtm_hec_token is set (AAP credential / vault). The index comes from the token.
vtm_hec_endpoint: https://splunk.example.com:8088/services/collector/event
vtm_hec_tls_verify: false

# --- Backups (kept on the appliance) -------------------------------------------------------
vtm_backup_prefix: vtm-config       # only backups with this prefix are pruned
vtm_backup_keep: 14
vtm_backup_before_change: true      # platform.yml takes one before it changes anything

# --- Admin server certificate from the lab CA (certificate.yml; pki/: step-ca) ---------------
# One certificate per traffic manager, for its admin UI/SOAP (:9090) and REST (:9070).
vtm_pki_host: ""                    # inventory host running the pki-ca container (required)
vtm_pki_container: pki-ca
vtm_pki_name: pki                   # pki_name: the admin provisioner's Podman secret is <name>-admin-password
vtm_pki_ca_port: 9443
vtm_pki_issued_dir: ""              # <pki_data>/issued on that host, for PKIIssuedCertExpiring; "" = don't record
vtm_cert_days: 90                   # lifetime; the CA's admin provisioner allows up to 365
vtm_cert_renew_days: 30             # a rerun renews within this many days of expiry
vtm_cert_key: EC-P256               # EC-P256 | RSA-2048 | RSA-3072 | RSA-4096
vtm_cert_ip_san: true               # add the traffic manager's IPv4 address(es) from DNS
vtm_cert_extra_sans: ""             # more names, comma-separated
vtm_cert_force: false               # issue a new one even if the current one is fine
# zeus.configd (REST, :9070) reads the certificate only at start; restart it over SSH so REST
# serves the new one too. Only the REST daemon restarts; traffic is not touched.
vtm_cert_restart_rest: true
vtm_ssh_user: root

# --- Admin server and REST TLS versions (platform.yml) ----------------------------------------
# global_settings admin.*: the admin server (UI/SOAP, vtm_admin_port), REST (zeus.configd) and
# internal connections. TLS 1.2 and 1.3 stay on. The admin server applies a change only when it
# restarts; platform.yml probes each traffic manager over SSH (vtm_ssh_user, as in
# certificate.yml) and restarts only the daemon still serving the old set.
vtm_admin_tls1: false
vtm_admin_tls1_1: false
vtm_admin_tls_restart: true

# --- Lab CA in the SSL catalogs (ca.yml; also run by hcp.yml) --------------------------------
# Root, intermediate and the intermediate's CRL from step-ca on vtm_pki_host, into the CA
# catalog (backend verification) and the admin CA catalog. step-ca reissues the CRL daily, so
# AAP reruns ca.yml every few hours; it writes only what changed.
vtm_ca_catalogs: [cas, admin_cas]
vtm_ca_name: Lab                    # catalog entries: <name>-Root-CA.pem, <name>-Intermediate-CA.pem, <name>-Intermediate-CA.crl

# --- HCP behind vTM (hcp.yml) ----------------------------------------------------------------
vtm_hcp_cluster: hcp01              # HCP system name; FQDN = <cluster>.<vtm_hcp_domain>
vtm_hcp_domain: example.com
vtm_hcp_nodes: [192.0.2.101]        # front-end IPs of the HCP nodes (list, or space/comma-separated)
vtm_hcp_prefix: HCP                 # object names: <prefix>_Data, <prefix>_MAPI, ... and <prefix>_Persistence
vtm_hcp_search: false               # HCP search console (8888)
vtm_hcp_prometheus: true            # HCP's Prometheus (9094): runs on some nodes and fails over; the monitor finds it
vtm_hcp_verify_backend: true        # verify HCP's certificate against the lab CA (strict), name = the cluster FQDN
# VIPs: given here (space/comma-separated), else allocated from NIOS as host records
# <cluster>-vip<N>.<vtm_hcp_domain> in vtm_hcp_vip_network.
vtm_hcp_vips: ""
vtm_hcp_vip_count: 1
vtm_hcp_vip_network: 192.0.2.0/24
nios_ip: 192.0.2.25
nios_wapi: "https://{{ nios_ip }}/wapi/v2.12"
nios_api_user: aap-ipam
vtm_nios_view: default
vtm_nios_candidates: 5
# The certificate vTM serves for the cluster: issued by the lab CA (vtm_pki_host) with the SANs
# HCP's own certificate has (read from node 1 on 443) plus these; renewed like the admin one.
vtm_hcp_cert_extra_sans: ""

# --- Monitoring (monitoring.yml): SNMPv3 -> snmp_exporter -> Prometheus -> Grafana ----------------
# vTM's agent offers SHA1 or MD5 for authentication and DES only for privacy (AES fails on 22.9r7).
vtm_snmp_user: prometheus
vtm_snmp_hash: sha1                 # sha1 | md5
# vtm_snmp_auth_password, vtm_snmp_priv_password: AAP credential "vTM SNMP" (or the vault), 8+ chars
vtm_snmp_allow: []                  # who may query the agent; [] = the monitoring host's address(es)
vtm_mon_host: ""                    # inventory host running snmp_exporter, Prometheus and Grafana
vtm_mon_owner: monitor              # user owning those rootless containers
vtm_snmp_exporter_unit: snmp-exporter          # quadlet <name>.container in ~/.config/containers/systemd
vtm_snmp_exporter_url: http://127.0.0.1:9116
vtm_snmp_exporter_conf_dir: .config/snmp_exporter   # relative to the owner's home; mounted at /etc/snmp_exporter
vtm_prom_config: /srv/prometheus/config        # host side of /etc/prometheus (scrape.d, rules.d)
vtm_prom_container: prometheus
vtm_prom_url: http://127.0.0.1:9090
vtm_grafana_provisioning: /srv/grafana-provisioning   # host side of /etc/grafana/provisioning
vtm_grafana_unit: grafana.service
vtm_grafana_folder: Network
vtm_scrape_interval: 30s
# Pools whose nodes may be down by design (HCP's Prometheus runs on only some nodes): no VtmNodeDown.
vtm_alert_node_down_ignore_pools: ".*_Prometheus"
