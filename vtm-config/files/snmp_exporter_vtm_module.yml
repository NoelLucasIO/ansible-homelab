# snmp_exporter module for Ivanti vTM (ZXTM-MIB, enterprise 1.3.6.1.4.1.7146.1.2), written for
# vtm-config. Metric names are the MIB object names. OIDs, types and index encodings were checked
# against vTM 22.9r7 (snmpwalk). Units: memory MB, *Response*/*QueueTime* ms, upTime 1/100 s.
# Enumerations: poolState 1 active, 2 disabled, 3 draining, 4 unused, 5 unknown;
#   perPoolNodeState 1 alive, 2 dead, 3 unknown, 4 draining, 5 drainingtodelete;
#   trafficIPInet46State 1 raised, 2 lowered; virtualserverProtocol 1 http, 2 https, ... (see the MIB).
modules:
  vtm:
    get:
      - 1.3.6.1.4.1.7146.1.2.6.10.0          # trafficIPNumberInet46
      - 1.3.6.1.4.1.7146.1.2.6.11.0          # trafficIPNumberRaisedInet46
