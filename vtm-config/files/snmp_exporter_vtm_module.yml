        help: "Total errors returned from the backend servers."
      - name: totalCurrentHTTPRequests
        oid: 1.3.6.1.4.1.7146.1.2.1.139
        type: gauge
        help: "Number of HTTP requests the traffic manager is currently serving or waiting on"
      - name: numIdleConnections
        oid: 1.3.6.1.4.1.7146.1.2.1.56
        type: gauge
        help: "Total number of idle HTTP connections to all nodes (used for future HTTP requests)."
