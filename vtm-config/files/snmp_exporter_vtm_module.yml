        type: gauge
        help: "The number of traffic IP addresses currently raised on this system (IPv4 and IPv6)."
      - name: trafficIPInet46State
        oid: 1.3.6.1.4.1.7146.1.2.6.12.1.3
        type: gauge
        help: "Whether this traffic IP address is currently being hosted by this traffic manager: 1 raised, 2 lowered."
        indexes:
          - labelname: trafficIPInet46AddressType
            type: gauge
          - labelname: trafficIPInet46Address
            type: InetAddress
      - name: version
        oid: 1.3.6.1.4.1.7146.1.2.1.1
