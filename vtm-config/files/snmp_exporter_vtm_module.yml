    metrics:
      - name: trafficIPNumberInet46
        oid: 1.3.6.1.4.1.7146.1.2.6.10
        type: gauge
        help: "The number of traffic IP addresses on this system (IPv4 and IPv6)."
      - name: trafficIPNumberRaisedInet46
