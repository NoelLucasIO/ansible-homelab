---
# One VIP host record in NIOS: reuse it if it exists, else the next free address that doesn't
# answer ping. Appends to vtm_hcp_vip_acc.
- name: VIP record name
  ansible.builtin.set_fact:
    vtm_vip_fqdn: "{{ vtm_hcp_cluster }}-vip{{ vtm_vip_idx }}.{{ vtm_hcp_domain }}"
    vtm_vip_addr: ""

- name: Look up in NIOS, {{ vtm_vip_fqdn }}
  ansible.builtin.uri:
    url: "{{ nios_wapi }}/record:host?name={{ vtm_vip_fqdn }}&view={{ vtm_nios_view }}&_return_fields=name,ipv4addrs"
    user: "{{ nios_api_user }}"
    password: "{{ nios_api_password }}"
    validate_certs: false
  register: vtm_vip_existing

- name: Reuse its address
  ansible.builtin.set_fact:
    vtm_vip_addr: "{{ vtm_vip_existing.json[0].ipv4addrs[0].ipv4addr }}"
  when: vtm_vip_existing.json | length > 0

- name: Only existing VIPs wanted (DNS step)
  ansible.builtin.assert:
    that: vtm_vip_existing.json | length > 0
    fail_msg: "NIOS has no {{ vtm_vip_fqdn }}; run the HCP template (hcp.yml) first, or give the VIPs."
    quiet: true
  when: vtm_hcp_vip_lookup_only | default(false) | bool

- name: Choose and record an address
  when: vtm_vip_existing.json | length == 0
  block:
    - name: Find the network
      ansible.builtin.uri:
        url: "{{ nios_wapi }}/network?network={{ vtm_hcp_vip_network }}"
        user: "{{ nios_api_user }}"
        password: "{{ nios_api_password }}"
        validate_certs: false
      register: vtm_vip_net

    - name: Network known to NIOS
      ansible.builtin.assert:
        that: vtm_vip_net.json | length > 0
        fail_msg: "NIOS has no network {{ vtm_hcp_vip_network }}."
        quiet: true

    - name: Ask NIOS for free addresses
      ansible.builtin.uri:
        url: "{{ nios_wapi }}/{{ vtm_vip_net.json[0]._ref }}?_function=next_available_ip"
        method: POST
        user: "{{ nios_api_user }}"
        password: "{{ nios_api_password }}"
        validate_certs: false
        body_format: json
        body: {num: "{{ vtm_nios_candidates | int }}"}
      register: vtm_vip_free

    - name: Ping the candidates (catches devices NIOS doesn't know)
      ansible.builtin.command: ping -c 2 -W 1 {{ item }}
      loop: "{{ vtm_vip_free.json.ips | reject('in', vtm_hcp_vip_acc | default([])) | list }}"
      register: vtm_vip_ping
      changed_when: false
      failed_when: false

    - name: Pick the first silent one
      ansible.builtin.set_fact:
        vtm_vip_addr: "{{ (vtm_vip_ping.results | selectattr('rc', 'ne', 0) | map(attribute='item') | list | first) | default('') }}"

    - name: Need a free address
      ansible.builtin.assert:
        that: vtm_vip_addr | length > 0
        fail_msg: "All {{ vtm_nios_candidates }} addresses NIOS offered in {{ vtm_hcp_vip_network }} answer ping."
        quiet: true

    - name: Host record (A + PTR), {{ vtm_vip_fqdn }}
      ansible.builtin.uri:
        url: "{{ nios_wapi }}/record:host"
        method: POST
        user: "{{ nios_api_user }}"
        password: "{{ nios_api_password }}"
        validate_certs: false
        body_format: json
        body:
          name: "{{ vtm_vip_fqdn }}"
          view: "{{ vtm_nios_view }}"
          configure_for_dns: true
          comment: "{{ vtm_owner_note }}: VIP for {{ vtm_hcp_fqdn }}"
          ipv4addrs: [{ipv4addr: "{{ vtm_vip_addr }}"}]
        status_code: [201]
      changed_when: true

- name: Collect
  ansible.builtin.set_fact:
    vtm_hcp_vip_acc: "{{ vtm_hcp_vip_acc | default([]) + [vtm_vip_addr] }}"
