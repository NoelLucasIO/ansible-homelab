---
# Take a full configuration backup on the appliance, then prune ours beyond vtm_backup_keep.
# In: vtm_backup_reason (goes into the description).
- name: Backup name
  ansible.builtin.set_fact:
    vtm_backup_name: "{{ vtm_backup_prefix }}-{{ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}"

- name: Take a full backup
  ansible.builtin.uri:
    url: "{{ vtm_api }}/status/local_tm/backups/full/{{ vtm_backup_name }}"
    method: PUT
    body_format: json
    body: {properties: {backup: {description: "{{ vtm_owner_note }}: {{ vtm_backup_reason }}"}}}
    status_code: [201]
  changed_when: true

- name: Backups on the appliance
  ansible.builtin.uri:
    url: "{{ vtm_api }}/status/local_tm/backups/full/"
  register: vtm_backups

- name: Remove the oldest of ours beyond {{ vtm_backup_keep }}
  ansible.builtin.uri:
    url: "{{ vtm_api }}/status/local_tm/backups/full/{{ item }}"
    method: DELETE
    status_code: [204]
  loop: "{{ (vtm_ours | sort)[: -(vtm_backup_keep | int)] if vtm_ours | length > vtm_backup_keep | int else [] }}"
  vars:
    # The timestamp in the name sorts chronologically.
    vtm_ours: "{{ vtm_backups.json.children | map(attribute='name') | select('match', vtm_backup_prefix ~ '-\\d{8}T\\d{6}Z$') | list }}"
  changed_when: true

- name: Backup taken
  ansible.builtin.debug:
    msg: "{{ vtm_backup_name }} on {{ vtm_target }} ({{ vtm_backup_reason }})"
